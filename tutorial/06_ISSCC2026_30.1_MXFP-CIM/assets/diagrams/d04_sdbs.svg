<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0e5a8a"/>
    </marker>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="960" height="520" fill="#f6f8fb"/>
  <rect x="20" y="14" width="920" height="46" rx="10" fill="#0f1b2d"/>
  <text x="480" y="43" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">SDBS（串行双位滑动）：把浮点乘法拆成 2b 一滑、垂直截断</text>

  <!-- 左：滑动示意 -->
  <rect x="40" y="80" width="420" height="360" rx="12" fill="#fff" stroke="#0e5a8a" stroke-width="2" filter="url(#sh)"/>
  <text x="60" y="108" fill="#0e5a8a" font-size="13.5" font-weight="700">垂直截断的滑动乘法</text>
  <g font-family="'Cascadia Code','Consolas',monospace" font-size="11.5">
    <text x="60" y="140" fill="#45536b">权重 MW（固定，不动）</text>
    <rect x="60" y="150" width="200" height="26" rx="4" fill="#eefaf3" stroke="#1d8a5f"/>
    <text x="70" y="168" fill="#1d8a5f">1 0 1 1 0 1（尾数位）</text>
    <text x="60" y="200" fill="#45536b">输入 MIN（每周期右滑 2b）</text>
    <rect x="60" y="210" width="200" height="26" rx="4" fill="#eef7fd" stroke="#0e5a8a"/>
    <text x="70" y="228" fill="#0e5a8a">1 0 1 0 0 1（周期0）</text>
    <rect x="60" y="240" width="200" height="26" rx="4" fill="#eef7fd" stroke="#0e5a8a"/>
    <text x="70" y="258" fill="#0e5a8a">  1 0 1 0 0 1（周期1 滑2b）</text>
    <rect x="60" y="270" width="200" height="26" rx="4" fill="#eef7fd" stroke="#0e5a8a"/>
    <text x="70" y="288" fill="#0e5a8a">    1 0 1 0 0 1（周期2 再滑2b）</text>
    <text x="60" y="322" fill="#6b3fa0" font-weight="600">→ 每次滑动乘出一段“垂直截断”的部分积</text>
    <text x="60" y="346" fill="#45536b">（不产生非垂直的斜线位 → 不浪费算力）</text>
  </g>
  <text x="60" y="396" fill="#c25e2e" font-size="12" font-weight="600">对比：输入对齐方案 [6,7,9,11] 的非垂直截断会</text>
  <text x="60" y="418" fill="#c25e2e" font-size="12" font-weight="600">在截断边界产生无效位 → 加法树白算</text>

  <!-- 右：数据流 -->
  <rect x="500" y="80" width="420" height="360" rx="12" fill="#fff" stroke="#6b3fa0" stroke-width="2" filter="url(#sh)"/>
  <text x="520" y="108" fill="#6b3fa0" font-size="13.5" font-weight="700">SDBS FP-MAC 数据流</text>
  <g font-size="11.5">
    <rect x="520" y="122" width="180" height="36" rx="6" fill="#eef7fd" stroke="#b8d9ee"/>
    <text x="610" y="144" text-anchor="middle" fill="#0e5a8a" font-weight="600">EA 指数加法器</text>
    <rect x="720" y="122" width="180" height="36" rx="6" fill="#fdf3e7" stroke="#e0a96a"/>
    <text x="810" y="144" text-anchor="middle" fill="#c25e2e" font-weight="600">MF 最大值查找</text>
    <rect x="520" y="172" width="180" height="36" rx="6" fill="#f5f0fc" stroke="#dcccf0"/>
    <text x="610" y="194" text-anchor="middle" fill="#6b3fa0" font-weight="600">SDT 滑动目标追踪</text>
    <text x="720" y="190" fill="#45536b">→ SC 滑动控制信号</text>
    <rect x="520" y="222" width="180" height="44" rx="6" fill="#eefaf3" stroke="#bfe6d2"/>
    <text x="610" y="240" text-anchor="middle" fill="#1d8a5f" font-weight="600">DBSU 双位滑动单元</text>
    <text x="610" y="258" text-anchor="middle" fill="#45536b">时钟门控+1b移位+寄存器</text>
    <rect x="720" y="222" width="180" height="44" rx="6" fill="#eef4fa" stroke="#c9d8ea"/>
    <text x="810" y="240" text-anchor="middle" fill="#0e5a8a" font-weight="600">PC 乘积压缩器</text>
    <text x="810" y="258" text-anchor="middle" fill="#45536b">仅 6 个全加器</text>
    <rect x="520" y="280" width="380" height="44" rx="6" fill="#f5f0fc" stroke="#dcccf0"/>
    <text x="710" y="302" text-anchor="middle" fill="#6b3fa0" font-weight="600">通道级加法树 + 累加/归一化（A&N）</text>
    <text x="520" y="350" fill="#45536b">关键：ESUM 越大 → MIN 越早开始滑动 → 高位优先对齐；</text>
    <text x="520" y="374" fill="#45536b">PBW = 计算周期数（2~14 周期可调）→ 位宽分配器动态调精度</text>
    <text x="520" y="410" fill="#1d8a5f" font-weight="600">→ 乘积压缩器只用 6 个全加器：加法树输入位宽 −42.9%，</text>
    <text x="520" y="432" fill="#1d8a5f" font-weight="600">面积 −35.9%、功耗 −40.0%（对比输入对齐方案）</text>
  </g>
</svg>
