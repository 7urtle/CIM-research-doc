<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="960" height="460" fill="#f6f8fb"/>
  <rect x="20" y="14" width="920" height="46" rx="10" fill="#0f1b2d"/>
  <text x="480" y="43" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">垂直截断 vs 非垂直截断：为什么“滑动”比“对齐”省算力</text>

  <!-- 非垂直截断 -->
  <text x="250" y="94" text-anchor="middle" fill="#c25e2e" font-size="15" font-weight="700">非垂直截断（输入对齐方案 [6,7,9,11]）</text>
  <rect x="40" y="108" width="420" height="200" rx="12" fill="#fff" stroke="#e0a96a" stroke-width="2" filter="url(#sh)"/>
  <g font-family="'Cascadia Code','Consolas',monospace" font-size="11">
    <text x="60" y="140" fill="#45536b">MW:  1 0 1 1 0 1</text>
    <text x="60" y="164" fill="#45536b">MIN:  1 0 1 0 0 1（右移 3 位后）</text>
    <text x="60" y="196" fill="#c25e2e">位积：斜线错位 → 边界处产生</text>
    <text x="60" y="218" fill="#c25e2e">“非垂直”的部分积（斜三角）</text>
    <rect x="60" y="236" width="240" height="40" rx="6" fill="#fdf3e7" stroke="#e0a96a"/>
    <text x="180" y="262" text-anchor="middle" fill="#c25e2e">无效位参与压缩 → 白算</text>
  </g>

  <!-- 垂直截断 -->
  <text x="710" y="94" text-anchor="middle" fill="#1d8a5f" font-size="15" font-weight="700">垂直截断（本文 SDBS 滑动）</text>
  <rect x="500" y="108" width="420" height="200" rx="12" fill="#fff" stroke="#bfe6d2" stroke-width="2" filter="url(#sh)"/>
  <g font-family="'Cascadia Code','Consolas',monospace" font-size="11">
    <text x="520" y="140" fill="#45536b">MW:  1 0 1 1 0 1</text>
    <text x="520" y="164" fill="#45536b">MIN:  1 0 1 0 0 1（每周期滑 2b）</text>
    <text x="520" y="196" fill="#1d8a5f">每次滑动 = 整列对齐（垂直）</text>
    <text x="520" y="218" fill="#1d8a5f">→ 截断位置干净，无无效位</text>
    <rect x="520" y="236" width="240" height="40" rx="6" fill="#eefaf3" stroke="#bfe6d2"/>
    <text x="640" y="262" text-anchor="middle" fill="#1d8a5f">每个位都算得有意义 → 不浪费</text>
  </g>

  <!-- 底部 -->
  <rect x="40" y="330" width="880" height="106" rx="10" fill="#eef4fa" stroke="#c9d8ea"/>
  <text x="60" y="358" fill="#0e5a8a" font-size="13.5" font-weight="700">为什么“垂直”很重要？</text>
  <text x="60" y="384" fill="#45536b" font-size="12.5">乘法器的部分积按“移位位置”累加——垂直截断意味着每次只算“一整列”的位积，列宽固定、无斜线；</text>
  <text x="60" y="406" fill="#45536b" font-size="12.5">非垂直截断会产生“半列”的无效位，它们也要进加法树，白白增加输入位宽和功耗。</text>
  <text x="60" y="428" fill="#1d8a5f" font-size="12.5" font-weight="600">SDBS 让“截断位置”永远落在整列边界 → 加法树输入位宽 −42.9%、面积 −35.9%、功耗 −40.0%</text>
</svg>
