<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="960" height="430" fill="#f6f8fb"/>
  <rect x="20" y="14" width="920" height="46" rx="10" fill="#0f1b2d"/>
  <text x="480" y="43" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">自适应保留位宽（PBW）：一个宏，覆盖从推理到训练</text>

  <!-- PBW 光谱 -->
  <text x="480" y="96" text-anchor="middle" fill="#123a57" font-size="14" font-weight="700">保留位宽（PBW）光谱 3b → 27b</text>
  <line x1="80" y1="130" x2="880" y2="130" stroke="#45536b" stroke-width="2"/>
  <g font-size="11">
    <text x="80" y="148" text-anchor="middle" fill="#6b7a93">3b</text>
    <text x="880" y="148" text-anchor="middle" fill="#6b7a93">27b</text>
    <rect x="80" y="118" width="120" height="4" fill="#c25e2e"/>
    <rect x="200" y="118" width="200" height="4" fill="#e8a33d"/>
    <rect x="400" y="118" width="240" height="4" fill="#1d8a5f"/>
    <rect x="640" y="118" width="240" height="4" fill="#0e5a8a"/>
    <text x="140" y="176" text-anchor="middle" fill="#c25e2e">3~9b</text>
    <text x="140" y="194" text-anchor="middle" fill="#45536b">BERT 推理</text>
    <text x="300" y="176" text-anchor="middle" fill="#c25e2e">11~17b</text>
    <text x="300" y="194" text-anchor="middle" fill="#45536b">LLaMA 推理</text>
    <text x="520" y="176" text-anchor="middle" fill="#1d8a5f">19~27b</text>
    <text x="520" y="194" text-anchor="middle" fill="#45536b">训练（ResNet-18 略胜 BF16）</text>
    <text x="760" y="176" text-anchor="middle" fill="#0e5a8a">高位宽高精度</text>
    <text x="760" y="194" text-anchor="middle" fill="#45536b">（代价是周期/功耗）</text>
  </g>

  <!-- 表格 -->
  <rect x="40" y="220" width="880" height="186" rx="10" fill="#fff" stroke="#dfe6f0" filter="url(#sh)"/>
  <g font-size="12">
    <text x="60" y="250" fill="#123a57" font-weight="700">PBW 与精度/PPA 的关系</text>
    <text x="60" y="278" fill="#45536b">• PBW ↑ → 平均相对误差（MRE）单调下降，但面积/功耗（PPA）也涨；</text>
    <text x="60" y="300" fill="#45536b">• BERT-base：3~9b 即可保 &lt;1% 精度损失（简单推理，低位宽最省）；</text>
    <text x="60" y="322" fill="#45536b">• LLaMA-3.1 8B：11~17b 近无损（复杂推理）；</text>
    <text x="60" y="344" fill="#45536b">• 19~27b：支持训练应用，ResNet-18 @CIFAR-100 略优于 BF16 格式；</text>
    <text x="60" y="374" fill="#1d8a5f" font-weight="600">双级分配收益：CGA −14.8%、FGA −29.3% 平均 PBW（精度无损）；</text>
    <text x="60" y="396" fill="#1d8a5f" font-weight="600">vs 固定 19b：吞吐 +1.20~1.43×；vs 固定 11b：精度 +1.49×（同吞吐）</text>
  </g>
</svg>
