<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="960" height="480" fill="#f6f8fb"/>
  <rect x="20" y="14" width="920" height="50" rx="10" fill="#0f1b2d"/>
  <text x="480" y="45" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">事件相机（EVS）+ 脉冲网络（SNN）：感知即事件，计算即脉冲</text>

  <!-- EVS -->
  <text x="250" y="94" text-anchor="middle" fill="#0e5a8a" font-size="15" font-weight="700">EVS（事件视觉传感器）</text>
  <rect x="40" y="108" width="420" height="220" rx="12" fill="#fff" stroke="#0e5a8a" stroke-width="2" filter="url(#sh)"/>
  <g font-size="12">
    <text x="60" y="140" fill="#45536b">• 传统相机按“帧”输出整幅图像；</text>
    <text x="60" y="164" fill="#0e5a8a" font-weight="600">EVS 只在“像素亮度变化”时输出事件</text>
    <text x="60" y="186" fill="#45536b">（x, y, 时间戳, 极性）→ 异步、稀疏、</text>
    <text x="60" y="208" fill="#45536b">只有边缘/运动信息（edge-only imaging）</text>
    <text x="60" y="240" fill="#1d8a5f" font-weight="600">优点：低功耗、高时间分辨率（μs 级）、</text>
    <text x="60" y="262" fill="#1d8a5f" font-weight="600">天然隐私（不记录完整图像）</text>
    <text x="60" y="296" fill="#45536b">本芯片片上 EVS：3.8 MEps、动态范围 130.9 dB</text>
  </g>

  <!-- SNN -->
  <text x="710" y="94" text-anchor="middle" fill="#6b3fa0" font-size="15" font-weight="700">SNN（脉冲神经网络）</text>
  <rect x="500" y="108" width="420" height="220" rx="12" fill="#fff" stroke="#6b3fa0" stroke-width="2" filter="url(#sh)"/>
  <g font-size="12">
    <text x="520" y="140" fill="#45536b">• 事件直接当作“脉冲输入”，无需帧转换；</text>
    <text x="520" y="164" fill="#45536b">• 事件驱动计算：没事件就不算 → 稀疏自适应；</text>
    <text x="520" y="186" fill="#45536b">• 神经元膜电位（Vmem）积分脉冲，达阈值发放；</text>
    <text x="520" y="220" fill="#6b3fa0" font-weight="600">→ EVS + SNN = 端到端事件驱动</text>
    <text x="520" y="242" fill="#6b3fa0" font-weight="600">省掉帧转换与冗余 MAC</text>
    <text x="520" y="296" fill="#45536b">（这是“感-存-算一体化”的前提：数据从传感器</text>
    <text x="520" y="316" fill="#45536b">到计算都以事件形式流动，不做格式转换）</text>
  </g>

  <rect x="40" y="350" width="880" height="106" rx="10" fill="#eef4fa" stroke="#c9d8ea"/>
  <text x="60" y="378" fill="#0e5a8a" font-size="13.5" font-weight="700">边缘感知 SoC 的三重需求（论文 Fig. 18.4.1 顶部）</text>
  <text x="60" y="404" fill="#45536b" font-size="12.5">① 高能效（电池供电）　② 隐私（数据不出设备）　③ 自适应（按用户/环境在线学习）</text>
  <text x="60" y="428" fill="#45536b" font-size="12.5">→ 本文路线：EVS 感知（隐私+低功耗）+ SNN 计算（能效）+ 片上在线学习 OCL（自适应）</text>
  <text x="60" y="450" fill="#6b3fa0" font-size="12.5" font-weight="600">而“在线学习”要用非易失存储（eNVM）才能永久保存 → 引出寿命问题（§2 挑战 3）</text>
</svg>
