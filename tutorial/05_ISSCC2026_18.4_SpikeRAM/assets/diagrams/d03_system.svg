<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0e5a8a"/>
    </marker>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="960" height="540" fill="#f6f8fb"/>
  <rect x="20" y="14" width="920" height="46" rx="10" fill="#0f1b2d"/>
  <text x="480" y="43" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">SpikeRAM 系统总览：EVS-sCNN（近存） + sFC-OCL（存内）+ MRAM（持久）</text>

  <!-- EVS -->
  <rect x="60" y="90" width="200" height="90" rx="10" fill="#eef7fd" stroke="#0e5a8a" stroke-width="2" filter="url(#sh)"/>
  <text x="160" y="116" text-anchor="middle" fill="#0e5a8a" font-size="13" font-weight="600">片上 EVS 传感器</text>
  <text x="160" y="140" text-anchor="middle" fill="#45536b" font-size="10.5">3.8 MEps · 130.9 dB</text>
  <text x="160" y="158" text-anchor="middle" fill="#45536b" font-size="10.5">异步事件输出</text>
  <path d="M260,135 H330" stroke="#0e5a8a" stroke-width="2.4" marker-end="url(#ar)"/>

  <!-- EVS-sCNN 核 -->
  <rect x="335" y="80" width="280" height="200" rx="12" fill="#fff" stroke="#1d8a5f" stroke-width="2" filter="url(#sh)"/>
  <text x="475" y="104" text-anchor="middle" fill="#1d8a5f" font-size="13" font-weight="600">EVS-sCNN 核（近存 NMC）</text>
  <g font-size="10.5">
    <rect x="350" y="116" width="120" height="30" rx="5" fill="#eefaf3" stroke="#bfe6d2"/>
    <text x="410" y="135" text-anchor="middle" fill="#1d8a5f">去噪 + 路由</text>
    <rect x="480" y="116" width="120" height="30" rx="5" fill="#eefaf3" stroke="#bfe6d2"/>
    <text x="540" y="135" text-anchor="middle" fill="#1d8a5f">sCNN PE 阵列</text>
    <text x="475" y="175" text-anchor="middle" fill="#45536b">事件驱动卷积（异步双轨握手）</text>
    <text x="475" y="195" text-anchor="middle" fill="#45536b">LIF 神经元 · 16b Vmem</text>
    <text x="475" y="215" text-anchor="middle" fill="#45536b">NoC 调度 · 分组打包路由</text>
    <text x="475" y="245" text-anchor="middle" fill="#6b7a93">（特征提取，无帧转换）</text>
  </g>
  <path d="M615,180 H670" stroke="#1d8a5f" stroke-width="2.4" marker-end="url(#ar)"/>

  <!-- sFC-OCL 核 -->
  <rect x="675" y="80" width="245" height="200" rx="12" fill="#fff" stroke="#6b3fa0" stroke-width="2" filter="url(#sh)"/>
  <text x="797" y="104" text-anchor="middle" fill="#6b3fa0" font-size="13" font-weight="600">sFC-OCL 核（存内 CIM）</text>
  <g font-size="10.5">
    <rect x="690" y="116" width="105" height="30" rx="5" fill="#f5f0fc" stroke="#dcccf0"/>
    <text x="742" y="135" text-anchor="middle" fill="#6b3fa0">事件滤波器</text>
    <rect x="802" y="116" width="105" height="30" rx="5" fill="#f5f0fc" stroke="#dcccf0"/>
    <text x="854" y="135" text-anchor="middle" fill="#6b3fa0">sFC PE（CIM）</text>
    <text x="797" y="175" text-anchor="middle" fill="#45536b">移位相加（无乘法）</text>
    <text x="797" y="195" text-anchor="middle" fill="#45536b">LIF/IF/InoF 神经元</text>
    <text x="797" y="215" text-anchor="middle" fill="#45536b">e-OTBP 在线学习</text>
    <text x="797" y="245" text-anchor="middle" fill="#6b7a93">（推理 + 学习复用状态）</text>
  </g>

  <!-- MRAM -->
  <rect x="60" y="310" width="860" height="90" rx="12" fill="#fff" stroke="#e8a33d" stroke-width="2" filter="url(#sh)"/>
  <text x="490" y="340" text-anchor="middle" fill="#c25e2e" font-size="13" font-weight="600">可选外接 40nm 4Mb MRAM（eNVM）：大网络 + 永久学习</text>
  <text x="490" y="368" text-anchor="middle" fill="#45536b" font-size="12">参数扩展 5.4×（101 类 N-Caltech101，时间复用）· 格雷码权重 + 三值梯度 → 写次数大减 → 寿命 +13.9×</text>
  <path d="M160,180 V330" stroke="#e8a33d" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="130" y="260" fill="#c25e2e" font-size="10.5" transform="rotate(-90 130 260)">参数扩展</text>

  <!-- 底部 -->
  <rect x="60" y="420" width="860" height="96" rx="10" fill="#eef4fa" stroke="#c9d8ea"/>
  <text x="80" y="448" fill="#0e5a8a" font-size="13" font-weight="700">“记忆中心（memory-centric）”的含义</text>
  <text x="80" y="474" fill="#45536b" font-size="12.5">整个系统以“数据（事件/权重）在哪里”为中心组织：感知端近传感计算（NMC）、分类端存内计算（CIM）、</text>
  <text x="80" y="496" fill="#45536b" font-size="12.5">学习端就地更新（eNVM）——数据从传感器到存储器几乎不跨总线搬运 → 48.1 pW/Synapse/Bit 的能效。</text>
</svg>
