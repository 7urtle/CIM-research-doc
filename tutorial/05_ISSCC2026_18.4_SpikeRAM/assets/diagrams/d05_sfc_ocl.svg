<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0e5a8a"/>
    </marker>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="960" height="500" fill="#f6f8fb"/>
  <rect x="20" y="14" width="920" height="46" rx="10" fill="#0f1b2d"/>
  <text x="480" y="43" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">sFC-OCL 核：存内计算（CIM）+ 移位相加 + 可配置神经元</text>

  <!-- 数据流 -->
  <g font-size="11">
    <rect x="60" y="90" width="180" height="60" rx="8" fill="#f5f0fc" stroke="#dcccf0"/>
    <text x="150" y="116" text-anchor="middle" fill="#6b3fa0" font-weight="600">加权脉冲输入</text>
    <text x="150" y="136" text-anchor="middle" fill="#45536b">（特征事件压缩）</text>
    <rect x="60" y="170" width="180" height="60" rx="8" fill="#fdf3e7" stroke="#e0a96a"/>
    <text x="150" y="196" text-anchor="middle" fill="#c25e2e" font-weight="600">可配置事件滤波器</text>
    <text x="150" y="216" text-anchor="middle" fill="#45536b">跳过冗余（DVS −92.4%）</text>
    <rect x="60" y="250" width="180" height="70" rx="8" fill="#eef7fd" stroke="#0e5a8a"/>
    <text x="150" y="276" text-anchor="middle" fill="#0e5a8a" font-weight="600">sFC PE1：8 个 CIM 宏</text>
    <text x="150" y="296" text-anchor="middle" fill="#45536b">32Kb RAM/宏 · 16 神经元</text>
    <rect x="60" y="340" width="180" height="70" rx="8" fill="#eef7fd" stroke="#0e5a8a"/>
    <text x="150" y="366" text-anchor="middle" fill="#0e5a8a" font-weight="600">sFC PE2：10 个 CIM 宏</text>
    <text x="150" y="386" text-anchor="middle" fill="#45536b">10Kb 权重 · 10 输出神经元</text>
    <path d="M240,120 H290" stroke="#6b3fa0" stroke-width="2" marker-end="url(#ar)"/>
    <path d="M240,200 H290" stroke="#c25e2e" stroke-width="2" marker-end="url(#ar)"/>
    <path d="M240,285 H290" stroke="#0e5a8a" stroke-width="2" marker-end="url(#ar)"/>
    <path d="M240,375 H290" stroke="#0e5a8a" stroke-width="2" marker-end="url(#ar)"/>
  </g>

  <!-- CIM 宏内部 -->
  <rect x="300" y="80" width="620" height="280" rx="12" fill="#fff" stroke="#0e5a8a" stroke-width="2" filter="url(#sh)"/>
  <text x="320" y="108" fill="#0e5a8a" font-size="13.5" font-weight="700">数字 CIM 宏内部（每 sFC PE）</text>
  <g font-size="11.5">
    <rect x="320" y="122" width="140" height="44" rx="6" fill="#eefaf3" stroke="#bfe6d2"/>
    <text x="390" y="144" text-anchor="middle" fill="#1d8a5f" font-weight="600">32Kb RAM</text>
    <text x="390" y="160" text-anchor="middle" fill="#45536b">8b 权重（格雷码存）</text>
    <rect x="480" y="122" width="140" height="44" rx="6" fill="#f5f0fc" stroke="#dcccf0"/>
    <text x="550" y="144" text-anchor="middle" fill="#6b3fa0" font-weight="600">SA + 格雷码解码器</text>
    <text x="550" y="160" text-anchor="middle" fill="#45536b">并行 XOR 二值读出</text>
    <rect x="640" y="122" width="140" height="44" rx="6" fill="#fdf3e7" stroke="#e0a96a"/>
    <text x="710" y="144" text-anchor="middle" fill="#c25e2e" font-weight="600">并行移位加法器</text>
    <text x="710" y="160" text-anchor="middle" fill="#45536b">权重移位累加进 Vmem</text>
    <rect x="800" y="122" width="100" height="44" rx="6" fill="#eef7fd" stroke="#b8d9ee"/>
    <text x="850" y="144" text-anchor="middle" fill="#0e5a8a" font-weight="600">16 神经元</text>
    <text x="850" y="160" text-anchor="middle" fill="#45536b">LIF/IF/InoF</text>
    <text x="320" y="210" fill="#45536b">加权脉冲的地址 → 激活对应字线 → 读出权重 →</text>
    <text x="320" y="232" fill="#45536b">移位并累加进膜电位 Vmem —— <strong>没有乘法器！</strong></text>
    <text x="320" y="262" fill="#1d8a5f" font-weight="600">为什么可以“无乘法”？</text>
    <text x="320" y="286" fill="#45536b">脉冲是 0/1：加权脉冲 = 权重 × 1 或 0 → 只是“选不选这个权重</text>
    <text x="320" y="308" fill="#45536b">”的问题 → 用移位加法器把权重加进 Vmem 即可，省掉乘法器</text>
    <text x="320" y="336" fill="#6b3fa0" font-weight="600">神经元三种行为：LIF（泄漏）、IF（积分）、InoF（抑制性/无阻？）</text>
    <text x="320" y="358" fill="#45536b">→ 按任务在“时间敏感性”与“能效”间动态权衡</text>
  </g>

  <!-- 底部 -->
  <rect x="60" y="390" width="860" height="86" rx="10" fill="#eef4fa" stroke="#c9d8ea"/>
  <text x="80" y="418" fill="#0e5a8a" font-size="13" font-weight="700">推理与学习的握手流水线（Fig. 18.4.3 底部）</text>
  <text x="80" y="442" fill="#45536b" font-size="12.5">推理时保存的中间状态（Vmem、脉冲）被<strong>复用</strong>到学习阶段（e-OTBP 反向传播）——</text>
  <text x="80" y="462" fill="#45536b" font-size="12.5">不用重算前向，学习开销大幅下降（这是“记忆中心”的又一体现）。</text>
</svg>
