<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="960" height="560" fill="#f6f8fb"/>
  <rect x="20" y="14" width="920" height="50" rx="10" fill="#0f1b2d"/>
  <text x="480" y="45" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">位串行比较方案 + MinMUX：MSB 优先，比较一旦分出大小就锁定</text>

  <!-- bit serial flow -->
  <rect x="40" y="84" width="880" height="150" rx="12" fill="#fff" stroke="#0e5a8a" stroke-width="2" filter="url(#sh)"/>
  <text x="60" y="110" fill="#0e5a8a" font-size="14" font-weight="700">MSB 优先的位串行比较（例：x=1010, w=0110 → min=x）</text>
  <g font-size="12">
    <!-- activation bits -->
    <text x="60" y="140" fill="#45536b">激活 x（MSB→LSB）</text>
    <g>
      <rect x="220" y="128" width="30" height="26" fill="#cfe0ee" stroke="#0e5a8a"/><text x="235" y="146" text-anchor="middle" fill="#0e5a8a" font-weight="600">1</text>
      <rect x="254" y="128" width="30" height="26" fill="#cfe0ee" stroke="#0e5a8a"/><text x="269" y="146" text-anchor="middle" fill="#0e5a8a">0</text>
      <rect x="288" y="128" width="30" height="26" fill="#cfe0ee" stroke="#0e5a8a"/><text x="303" y="146" text-anchor="middle" fill="#0e5a8a">1</text>
      <rect x="322" y="128" width="30" height="26" fill="#cfe0ee" stroke="#0e5a8a"/><text x="337" y="146" text-anchor="middle" fill="#0e5a8a">0</text>
    </g>
    <text x="380" y="146" fill="#45536b">MSB 先来</text>
    <text x="60" y="182" fill="#45536b">权重 w（MSB→LSB）</text>
    <g>
      <rect x="220" y="170" width="30" height="26" fill="#e8d8b0" stroke="#a08020"/><text x="235" y="188" text-anchor="middle" fill="#7a5c10">0</text>
      <rect x="254" y="170" width="30" height="26" fill="#e8d8b0" stroke="#a08020"/><text x="269" y="188" text-anchor="middle" fill="#7a5c10">1</text>
      <rect x="288" y="170" width="30" height="26" fill="#e8d8b0" stroke="#a08020"/><text x="303" y="188" text-anchor="middle" fill="#7a5c10">1</text>
      <rect x="322" y="170" width="30" height="26" fill="#e8d8b0" stroke="#a08020"/><text x="337" y="188" text-anchor="middle" fill="#7a5c10">0</text>
    </g>
    <text x="380" y="188" fill="#45536b">第1位 1&gt;0 → 立即判定 x&gt;w → 锁定 min=x</text>
    <text x="60" y="222" fill="#1d8a5f" font-weight="600">早期停止：一旦比较结果确定，后续周期不再预充/读权重位（蓝色位省电）</text>
  </g>

  <!-- circuit -->
  <rect x="40" y="254" width="880" height="280" rx="12" fill="#fff" stroke="#1d8a5f" stroke-width="2" filter="url(#sh)"/>
  <text x="60" y="280" fill="#1d8a5f" font-size="14" font-weight="700">MinMUX 电路与 SRAM 读端口（图 8/9 的电路级实现）</text>
  <g font-size="12">
    <!-- SRAM -->
    <rect x="70" y="296" width="150" height="90" rx="8" fill="#e4f2ea" stroke="#1d8a5f"/>
    <text x="145" y="320" text-anchor="middle" fill="#1d8a5f">8T SRAM 单元</text>
    <text x="145" y="340" text-anchor="middle" fill="#45536b">权重位存储</text>
    <text x="145" y="356" text-anchor="middle" fill="#45536b">W / WB</text>
    <text x="145" y="372" text-anchor="middle" fill="#45536b">(差分输出)</text>
    <!-- comparator -->
    <rect x="280" y="296" width="170" height="90" rx="8" fill="#fdeeda" stroke="#f0a030"/>
    <text x="365" y="318" text-anchor="middle" fill="#a06510">改进动态比较器</text>
    <text x="365" y="338" text-anchor="middle" fill="#45536b">输出 OUT / OUTB</text>
    <text x="365" y="356" text-anchor="middle" fill="#45536b">（比较结果锁存）</text>
    <text x="365" y="374" text-anchor="middle" fill="#45536b">控制 MinMUX</text>
    <!-- MinMUX -->
    <rect x="510" y="296" width="170" height="90" rx="8" fill="#f5f0fc" stroke="#6b3fa0"/>
    <text x="595" y="318" text-anchor="middle" fill="#6b3fa0">MinMUX</text>
    <text x="595" y="338" text-anchor="middle" fill="#45536b">传输门选择</text>
    <text x="595" y="356" text-anchor="middle" fill="#45536b">min(x,w) 位流出</text>
    <!-- MinACCU -->
    <rect x="740" y="296" width="150" height="90" rx="8" fill="#d9f0e4" stroke="#1d8a5f"/>
    <text x="815" y="318" text-anchor="middle" fill="#1d8a5f">MinACCU</text>
    <text x="815" y="338" text-anchor="middle" fill="#45536b">Σ min(xi,wi)</text>
    <text x="815" y="356" text-anchor="middle" fill="#45536b">时钟门控</text>
    <!-- arrows -->
    <line x1="222" y1="341" x2="278" y2="341" stroke="#f0a030" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="452" y1="341" x2="508" y2="341" stroke="#f0a030" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="682" y1="341" x2="738" y2="341" stroke="#1d8a5f" stroke-width="2" marker-end="url(#ar)"/>
    <!-- behavior -->
    <text x="70" y="420" fill="#45536b">OUT/OUTB 初态：OUT=VDD, OUTB=VSS（预充）</text>
    <text x="70" y="442" fill="#45536b">权重更小 → OUT 放电到 VSS、OUTB 被钳到 VDD → MinMUX 持续输出权重位</text>
    <text x="70" y="464" fill="#45536b">激活更小 → OUTB 放电到 VSS、OUT 被钳到 VDD → MinMUX 持续输出激活位</text>
    <text x="70" y="486" fill="#45536b">比较未分出时（相等位）：维持电荷，继续下一周期</text>
    <text x="70" y="516" fill="#1d8a5f" font-weight="600">读端口：权重位=0 → 局部读位线保持预充 → 连续 0 省电；激活被选后停止重复预充（1.8× 省电）</text>
  </g>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-fill"/>
    </marker>
  </defs>
</svg>
