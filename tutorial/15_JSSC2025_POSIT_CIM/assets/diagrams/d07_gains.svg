<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="960" height="560" fill="#f6f8fb"/>
  <rect x="20" y="14" width="920" height="50" rx="10" fill="#0f1b2d"/>
  <text x="480" y="45" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">三招的实测贡献：BRPU / CPCS / CASU 各自省了多少</text>

  <!-- BRPU -->
  <rect x="40" y="84" width="290" height="220" rx="12" fill="#fff" stroke="#1d8a5f" stroke-width="2" filter="url(#sh)"/>
  <text x="60" y="110" fill="#1d8a5f" font-size="13.5" font-weight="700">① BRPU（regime 处理）</text>
  <g font-size="11.5">
    <text x="60" y="136" fill="#45536b">shift-OR 简化 codec+加法+编码</text>
    <text x="60" y="158" fill="#45536b">regime 处理能耗省 40.3%（摘要）</text>
    <text x="60" y="180" fill="#45536b">三模型平均能效 +29.7%</text>
    <text x="60" y="202" fill="#45536b">双向移位调度再 +39%</text>
    <text x="60" y="228" fill="#1d8a5f" font-weight="600">ResNet18 训练：3.48→6.75 TFLOPS/W</text>
    <text x="60" y="252" fill="#1d8a5f" font-weight="600">（1.94×）POSIT16</text>
    <text x="60" y="280" fill="#45536b">面积 −67.8% · 功耗 −79.6%（regime 单元）</text>
  </g>

  <!-- CPCS -->
  <rect x="345" y="84" width="290" height="220" rx="12" fill="#fff" stroke="#f0a030" stroke-width="2" filter="url(#sh)"/>
  <text x="365" y="110" fill="#d08a10" font-size="13.5" font-weight="700">② CPCS（CIM 单元利用）</text>
  <g font-size="11.5">
    <text x="365" y="136" fill="#45536b">空闲单元存关键位 → 双位 MAC</text>
    <text x="365" y="158" fill="#45536b">单元利用率提升 63.0%（摘要）</text>
    <text x="365" y="180" fill="#45536b">3b 尾数存储时吞吐 +38.2%</text>
    <text x="365" y="202" fill="#45536b">2–4b 关联再 +24.7%</text>
    <text x="365" y="224" fill="#45536b">3b 优先分区（POSIT16）+1.34×</text>
    <text x="365" y="252" fill="#d08a10" font-weight="600">系统能效 +1.46×（平均）~1.96×</text>
    <text x="365" y="280" fill="#45536b">CIM 核 POSIT8 峰值 45.54 TFLOPS/W</text>
  </g>

  <!-- CASU -->
  <rect x="650" y="84" width="270" height="220" rx="12" fill="#fff" stroke="#6b3fa0" stroke-width="2" filter="url(#sh)"/>
  <text x="670" y="110" fill="#6b3fa0" font-size="13.5" font-weight="700">③ CASU（加法树）</text>
  <g font-size="11.5">
    <text x="670" y="136" fill="#45536b">OR 替代加法（无重叠位）</text>
    <text x="670" y="158" fill="#45536b">加法树能耗省 56.9%（摘要）</text>
    <text x="670" y="180" fill="#45536b">三模型平均 +25.7%</text>
    <text x="670" y="202" fill="#45536b">提前检测省 36.1% 加法器</text>
    <text x="670" y="224" fill="#45536b">循环交替调度再省 31.3%</text>
    <text x="670" y="252" fill="#6b3fa0" font-weight="600">POSIT16 系统能效 → 27.61 TFLOPS/W</text>
    <text x="670" y="280" fill="#45536b">加法树功耗占比 23.4%→12.3%</text>
  </g>

  <!-- combined -->
  <rect x="40" y="324" width="880" height="210" rx="12" fill="#eef4fa" stroke="#c9d8ea"/>
  <text x="60" y="350" fill="#0e5a8a" font-size="14" font-weight="700">组合评估（论文 Fig.18 + 表 I）</text>
  <g font-size="12.5">
    <text x="60" y="380" fill="#45536b">三模型（ResNet18 训练 / GPT-2 训练 / ViT-B 推理）：PD-CIM 平均省能 7.94×</text>
    <text x="60" y="408" fill="#1d8a5f" font-weight="600">峰值能效 83.23 TFLOPS/W @ POSIT(8,1)（0.65V / 260 MHz）</text>
    <text x="60" y="436" fill="#45536b">ResNet18 训练（POSIT16）：5.35 TFLOPS/W（含全局 SRAM 3.48）→ 三招后 27.61 TFLOPS/W（CIM 核 83.23）</text>
    <text x="60" y="464" fill="#45536b">精度：POSIT16 vs FP32 仅掉 0.04%；ViT-B POSIT8 ≈ FP16（超 FP8 4.76%）</text>
    <text x="60" y="500" fill="#6b3fa0" font-weight="600">vs SOTA FP-CIM [15]：平均能效 41.5 TFLOPS/W（超 2.36×）· 加速 3.51×（419 MHz 是其 2.68× + 双位 MAC 1.31×）</text>
    <text x="60" y="526" fill="#45536b">vs [16]（同 50% 稀疏）：能效超 2.6×；16 PD-CIM 系统（tensor-parallel）线性扩展到 15.3×</text>
  </g>
</svg>
