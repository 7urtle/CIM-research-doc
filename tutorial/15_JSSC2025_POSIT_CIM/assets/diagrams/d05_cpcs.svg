<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="960" height="560" fill="#f6f8fb"/>
  <rect x="20" y="14" width="920" height="50" rx="10" fill="#0f1b2d"/>
  <text x="480" y="45" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">CPCS：关键位预计算并存储 → 空闲单元实现双位 MAC（论文 Fig.8–10）</text>

  <!-- problem -->
  <rect x="40" y="84" width="430" height="150" rx="12" fill="#fff" stroke="#e66e5a" stroke-width="2" filter="url(#sh)"/>
  <text x="60" y="110" fill="#e66e5a" font-size="13.5" font-weight="700">问题：动态尾数位宽 vs 固定 4b 单元</text>
  <g font-size="11.5">
    <text x="60" y="136" fill="#45536b">ResNet18 训练中 POSIT(8,1) 尾数位宽分布：2/3/4 位占多数</text>
    <text x="60" y="158" fill="#45536b">按 4b 设计 CIM 单元 → 存 2/3b 尾数时浪费（占 61.9%）</text>
    <g>
      <rect x="70" y="172" width="80" height="26" fill="#d9f0e4" stroke="#1d8a5f"/><text x="110" y="190" text-anchor="middle" fill="#1d8a5f" font-size="10">4b 满</text>
      <rect x="154" y="172" width="80" height="26" fill="#fdeeda" stroke="#f0a030"/><text x="194" y="190" text-anchor="middle" fill="#a06510" font-size="10">3b + 1 空闲</text>
      <rect x="238" y="172" width="80" height="26" fill="#fdeeda" stroke="#f0a030"/><text x="278" y="190" text-anchor="middle" fill="#a06510" font-size="10">2b + 2 空闲</text>
      <text x="330" y="190" fill="#45536b" font-size="10">POSIT16 更严重（85.7%）</text>
    </g>
    <text x="60" y="222" fill="#e66e5a" font-weight="600">动态分区路由复杂度 O(N²) → 不可行</text>
  </g>

  <!-- idea -->
  <rect x="490" y="84" width="430" height="150" rx="12" fill="#fff" stroke="#1d8a5f" stroke-width="2" filter="url(#sh)"/>
  <text x="510" y="110" fill="#1d8a5f" font-size="13.5" font-weight="700">CPCS 思想：预计算关键位存进空闲单元</text>
  <g font-size="11.5">
    <text x="510" y="136" fill="#45536b">存 3b 尾数 W 于 4b 单元 → 每周期可做双位 MAC：</text>
    <text x="510" y="160" fill="#45536b" font-family="monospace">O = W×A[n] + W×A[n+2]</text>
    <text x="510" y="186" fill="#45536b">关键位 S[1] = W[1]∧(W[0]&amp;W[2]) 是晶体管最多的位</text>
    <text x="510" y="208" fill="#45536b">→ 加载时预计算 S[1]，存进空闲单元 → 运行时直接取</text>
    <text x="510" y="228" fill="#1d8a5f" font-weight="600">→ 每周期双位 MAC → 吞吐↑、利用率↑</text>
  </g>

  <!-- dual bit MAC detail -->
  <rect x="40" y="254" width="880" height="150" rx="12" fill="#fff" stroke="#0e5a8a" stroke-width="2" filter="url(#sh)"/>
  <text x="60" y="280" fill="#0e5a8a" font-size="13.5" font-weight="700">双位 MAC 计算细节（存 3b 尾数 W 于 4b 单元）</text>
  <g font-size="12">
    <text x="60" y="310" fill="#45536b">单元收到 A[n]|A[n+2]，计算 W×(A[n]|A[n+2]) 得部分积 P[2:0]：</text>
    <text x="80" y="336" fill="#45536b">A[n+2]/A[n] = 00 或 01 → O = P[2:0]</text>
    <text x="80" y="360" fill="#45536b">A[n+2]/A[n] = 10 → O = P[2:0] ≪ 2</text>
    <text x="80" y="384" fill="#45536b">A[n+2]/A[n] = 11 → O = P[2:0] + P[2:0]≪2 = S[3:0]‖P[1:0]，其中 S[1] 是“关键位”</text>
    <text x="60" y="406" fill="#1d8a5f" font-weight="600">S[1]=W[P] 用晶体管最多 → CPCS 预计算并存空闲单元 → 每周期完成两个 MAC</text>
  </g>

  <!-- modes -->
  <rect x="40" y="424" width="880" height="110" rx="12" fill="#eef4fa" stroke="#c9d8ea"/>
  <text x="60" y="450" fill="#0e5a8a" font-size="14" font-weight="700">2–4b 关联与 3b 优先分区（论文 Fig.9）</text>
  <g font-size="12">
    <text x="60" y="478" fill="#1d8a5f" font-weight="600">2–4b 关联：</text>
    <text x="150" y="478" fill="#45536b">4b 尾数 Wn[0]=0 时可视为 3b（Wn[3:1]）→ 借存 2b 尾数单元的空闲位存 Wn[P] → 吞吐 +31%</text>
    <text x="60" y="504" fill="#1d8a5f" font-weight="600">3b 优先分区：</text>
    <text x="150" y="504" fill="#45536b">POSIT16 长尾数（如 9b “100111011”）切成三段“100X/111X/011X”→ 全部可双位 MAC → 吞吐 +1.34×</text>
  </g>
</svg>
