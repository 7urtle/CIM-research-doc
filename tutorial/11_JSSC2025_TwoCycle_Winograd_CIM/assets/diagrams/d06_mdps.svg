<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="960" height="490" fill="#f6f8fb"/>
  <rect x="20" y="14" width="920" height="46" rx="10" fill="#0f1b2d"/>
  <text x="480" y="43" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">创新③：MDPS 宏级并行双端稀疏 —— 激活和权重都“压缩着算”</text>

  <!-- 激活侧 -->
  <rect x="40" y="80" width="420" height="240" rx="12" fill="#fff" stroke="#0e5a8a" stroke-width="2" filter="url(#sh)"/>
  <text x="60" y="108" fill="#0e5a8a" font-size="13.5" font-weight="700">激活侧：位掩码 + tile 压缩</text>
  <g font-size="11.5">
    <text x="60" y="140" fill="#45536b">• ISPU 里的位掩码生成器，按激活稀疏度</text>
    <text x="60" y="162" fill="#45536b">　生成 bit-mask（稀疏控制）；</text>
    <text x="60" y="192" fill="#45536b">• <strong>连续 4 个稀疏数据就跳过</strong>（对应单个</text>
    <text x="60" y="214" fill="#45536b">　4×32 宏的输入规模）；</text>
    <text x="60" y="244" fill="#45536b">• tile 压缩器去掉连续稀疏段，tile 分配器</text>
    <text x="60" y="266" fill="#45536b">　把剩余有效数据依次送入宏</text>
    <text x="60" y="296" fill="#0e5a8a" font-weight="600">→ 激活输入周期减少（50% 稀疏时 ~1.84×）</text>
  </g>

  <!-- 权重侧 -->
  <rect x="500" y="80" width="420" height="240" rx="12" fill="#fff" stroke="#6b3fa0" stroke-width="2" filter="url(#sh)"/>
  <text x="520" y="108" fill="#6b3fa0" font-size="13.5" font-weight="700">权重侧：水平压缩 + PPRS 重排</text>
  <g font-size="11.5">
    <text x="520" y="140" fill="#45536b">• 稀疏权重<strong>不存进宏</strong>（省下的宏可映射其他工作）；</text>
    <text x="520" y="170" fill="#45536b">• <strong>水平压缩</strong>：只改权重的<strong>列位置</strong>、不改行位置</text>
    <text x="520" y="192" fill="#45536b">　→ 稀疏随机分布不会引起激活重新进入；</text>
    <text x="520" y="222" fill="#45536b">• PPRS（部分积右移器）：按权重索引把每个</text>
    <text x="520" y="244" fill="#45536b">　P[10:0] 移回正确位置，再进 4 输入加法树</text>
    <text x="520" y="274" fill="#6b3fa0" font-weight="600">→ 宏利用率提升（50% 稀疏时 ~1.76×）</text>
  </g>

  <!-- 合并 -->
  <rect x="40" y="344" write="0" width="880" height="122" rx="10" fill="#fff" stroke="#dfe6f0" stroke-width="2" filter="url(#sh)"/>
  <text x="60" y="372" fill="#123a57" font-size="13.5" font-weight="700">第三步：OMB 合并（把有效结果写回正确位置）</text>
  <g font-size="11.5">
    <text x="60" y="402" fill="#45536b">• 每个 36×32 宏配 1kB OMB：权重索引 + 合并配置（由 bit-mask 生成）控制写地址；</text>
    <text x="60" y="426" fill="#45536b">• 有效 MAC 结果写入正确位置、零值写入空白处 → 输出完整 tile；</text>
    <text x="60" y="450" fill="#45536b">• Cout 太多时 PPRS 无法全部重排的部分积 → 间隔周期直接送 OMB → SIMD + 全局 SRAM 补加（隐藏延迟）。</text>
  </g>
  <rect x="40" y="470" width="880" height="0" rx="0"/>
  <rect x="40" y="470" width="880" height="0" rx="0"/>
  <rect x="40" y="470" width="880" height="30" rx="8" fill="#eefaf3" stroke="#bfe6d2"/>
  <text x="480" y="490" text-anchor="middle" fill="#1d8a5f" font-size="12.5" font-weight="600">→ 50% 激活 + 50% 权重稀疏：能效 3.11×（ISPU/PPRS/OMB 面积 4.5%、功耗 7.8%）</text>
</svg>
