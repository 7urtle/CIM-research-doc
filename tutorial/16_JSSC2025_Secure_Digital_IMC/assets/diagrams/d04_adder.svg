<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="960" height="540" fill="#f6f8fb"/>
  <rect x="20" y="14" width="920" height="50" rx="10" fill="#0f1b2d"/>
  <text x="480" y="45" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">安全加法树与位串行累加器（论文 Fig.3–5）</text>

  <!-- adder tree -->
  <rect x="40" y="84" width="430" height="220" rx="12" fill="#fff" stroke="#1d8a5f" stroke-width="2" filter="url(#sh)"/>
  <text x="60" y="110" fill="#1d8a5f" font-size="13.5" font-weight="700">进位保存加法树（CSA）vs 行波进位</text>
  <g font-size="12">
    <text x="60" y="138" fill="#45536b">传统行波进位：进位逐级传播 → 延迟长</text>
    <text x="60" y="160" fill="#45536b">进位保存：进位不立即传播 → 延迟短</text>
    <text x="60" y="182" fill="#45536b">3 操作数一次合并 → 全加器即可，无需半加器</text>
    <g>
      <rect x="70" y="196" width="90" height="30" rx="6" fill="#d9f0e4" stroke="#1d8a5f"/>
      <text x="115" y="216" text-anchor="middle" fill="#1d8a5f" font-size="10.5">3 输入</text>
      <text x="172" y="204" fill="#45536b">→</text>
      <rect x="188" y="196" width="90" height="30" rx="6" fill="#d9f0e4" stroke="#1d8a5f"/>
      <text x="233" y="216" text-anchor="middle" fill="#1d8a5f" font-size="10.5">全加器×2</text>
      <text x="290" y="204" fill="#45536b">→</text>
      <rect x="306" y="196" width="90" height="30" rx="6" fill="#d9f0e4" stroke="#1d8a5f"/>
      <text x="351" y="216" text-anchor="middle" fill="#1d8a5f" font-size="10.5">进位+和</text>
    </g>
    <text x="60" y="258" fill="#1d8a5f" font-size="11.5" font-weight="600">避免半加器（其 AND 不满足均匀性）→ 免随机比特刷新</text>
    <text x="60" y="282" fill="#45536b">削减最后 2 级流水，部分和在修改版进位保存格式下留给累加器处理 → 延迟更低</text>
  </g>

  <!-- uniformity -->
  <rect x="490" y="84" width="430" height="220" rx="12" fill="#fff" stroke="#6b3fa0" stroke-width="2" filter="url(#sh)"/>
  <text x="510" y="110" fill="#6b3fa0" font-size="13.5" font-weight="700">近似均匀性（论文 Fig.4）</text>
  <g font-size="12">
    <text x="510" y="138" fill="#45536b">全加器的和/进位输出不联合均匀（[52]）</text>
    <text x="510" y="160" fill="#45536b">但它们从不同位位置、经无关加法级后才会合并</text>
    <text x="510" y="182" fill="#45536b">中间逻辑混合无关比特 → 偏差大幅降低</text>
    <g>
      <text x="520" y="206" fill="#45536b">直接合并：CV=0.44</text>
      <rect x="520" y="212" width="180" height="16" fill="#fde8e4" stroke="#e66e5a"/>
      <text x="520" y="236" fill="#45536b">经 1 级无关加法：CV=0.11</text>
      <rect x="520" y="242" width="180" height="16" fill="#fdeeda" stroke="#f0a030"/>
      <text x="520" y="266" fill="#45536b">经 2 级无关加法：CV=0.01</text>
      <rect x="520" y="272" width="180" height="16" fill="#d9f0e4" stroke="#1d8a5f"/>
      <text x="720" y="244" fill="#45536b" font-size="11">CV=变异系数（越小越均匀）</text>
    </g>
    <text x="510" y="300" fill="#6b3fa0" font-size="11.5" font-weight="600">实际攻击采样有限 → 近似均匀足够（计算性而非数学性）</text>
  </g>

  <!-- accumulator -->
  <rect x="40" y="324" width="880" height="190" rx="12" fill="#eef4fa" stroke="#c9d8ea"/>
  <text x="60" y="350" fill="#0e5a8a" font-size="14" font-weight="700">位串行累加器的特殊处理（论文 Fig.5）</text>
  <g font-size="12.5">
    <text x="60" y="380" fill="#45536b">首次累加（激活 MSB）时，上一累加值需清零——但「把共享秘密与已知 0 相加」不安全</text>
    <text x="60" y="408" fill="#1d8a5f" font-weight="600">解法：能直接赋值就赋值；7 个含重置 0 的全加器用「随机 0 的共享」</text>
    <text x="80" y="434" fill="#45536b">不用 14 个运行期随机比特（s1=r1, s2=r2, s3=r1⊕r2），而是复用<strong>上一次累加器的 2 份</strong>构造随机 0 共享</text>
    <text x="80" y="460" fill="#45536b">→ 只有芯片启动时需要一次性随机比特，运行期零随机比特</text>
    <text x="60" y="492" fill="#45536b">用功能蒙特卡洛仿真验证不同激活/权重偏差、不同权重更新频率下的均匀性</text>
  </g>
</svg>
