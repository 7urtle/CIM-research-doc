<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="960" height="560" fill="#f6f8fb"/>
  <rect x="20" y="14" width="920" height="50" rx="10" fill="#0f1b2d"/>
  <text x="480" y="45" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">数据搬移优化：正常卷积 vs 转置卷积（零插入 + 数据前瞻）</text>

  <!-- normal conv -->
  <rect x="40" y="84" width="430" height="230" rx="12" fill="#fff" stroke="#1d8a5f" stroke-width="2" filter="url(#sh)"/>
  <text x="60" y="110" fill="#1d8a5f" font-size="14" font-weight="700">正常卷积（3×3）</text>
  <g font-size="11.5">
    <text x="60" y="136" fill="#45536b">P1=输入供给，P2/P3 交替做部分和缓冲（双缓冲）</text>
    <text x="60" y="156" fill="#45536b">run1：base=0，x 指针取 RL0/1/2 的 PixelPack</text>
    <g>
      <rect x="70" y="168" width="60" height="24" fill="#d9f0e4" stroke="#1d8a5f"/><rect x="134" y="168" width="60" height="24" fill="#d9f0e4" stroke="#1d8a5f"/><rect x="198" y="168" width="60" height="24" fill="#d9f0e4" stroke="#1d8a5f"/>
      <text x="100" y="185" text-anchor="middle" fill="#1d8a5f" font-size="10">RL0</text><text x="164" y="185" text-anchor="middle" fill="#1d8a5f" font-size="10">RL1</text><text x="228" y="185" text-anchor="middle" fill="#1d8a5f" font-size="10">RL2</text>
      <text x="280" y="178" fill="#45536b" font-size="10.5">→ 三深度寄存器缓存</text>
    </g>
    <text x="60" y="214" fill="#45536b">第 2 行：RL1/2/3；RL3 base=0+IX 定位到 bank0 → 无 bank 冲突</text>
    <text x="60" y="234" fill="#45536b">run2：从 P3 取部分和（P2/P3 互换角色），部分和存 12-bit 扩展 PixelPack</text>
    <text x="60" y="254" fill="#45536b">x 指针按规则选 bank → 无缝衔接下一层</text>
    <text x="60" y="286" fill="#1d8a5f" font-size="11.5" font-weight="600">特点：输入带宽按需取，窗口数据复用 → 搬移最小化</text>
  </g>

  <!-- transposed conv -->
  <rect x="490" y="84" width="430" height="230" rx="12" fill="#fff" stroke="#6b3fa0" stroke-width="2" filter="url(#sh)"/>
  <text x="510" y="110" fill="#6b3fa0" font-size="14" font-weight="700">转置卷积（FX=FY=4，上采样）</text>
  <g font-size="11.5">
    <text x="510" y="136" fill="#45536b">输入插零上采样 → 需要更复杂的行取机制</text>
    <text x="510" y="156" fill="#45536b">每周期最大输入通道降为 18 → 跨两个 PixelPack（C 维不对齐）</text>
    <g>
      <rect x="510" y="172" width="24" height="20" fill="#f5f0fc" stroke="#6b3fa0"/><rect x="536" y="172" width="24" height="20" fill="#f5f0fc" stroke="#6b3fa0"/><text x="562" y="186" fill="#7f93ad">…</text>
      <rect x="574" y="172" width="24" height="20" fill="#f5f0fc" stroke="#6b3fa0"/>
      <text x="620" y="178" fill="#45536b" font-size="10.5">PixelPack1（通道 0–17）</text>
      <rect x="510" y="200" width="24" height="20" fill="#f5f0fc" stroke="#6b3fa0"/><rect x="536" y="200" width="24" height="20" fill="#f5f0fc" stroke="#6b3fa0"/><text x="562" y="214" fill="#7f93ad">…</text>
      <rect x="574" y="200" width="24" height="20" fill="#f5f0fc" stroke="#6b3fa0"/>
      <text x="620" y="206" fill="#45536b" font-size="10.5">PixelPack2（通道 18–35）</text>
    </g>
    <text x="510" y="244" fill="#45536b">好处：插零后新输入请求频率减半（vs 正常卷积）</text>
    <text x="510" y="264" fill="#45536b">→ 数据前瞻（look-ahead）：t=n 时预取下一像素 PixelPack1，t=n+1 取 PixelPack2</text>
    <text x="510" y="286" fill="#1d8a5f" font-size="11.5" font-weight="600">16 种细粒度 PixelPack 取数模式 → 全速执行 FX=FY=4 转置卷积</text>
  </g>

  <!-- precision control -->
  <rect x="40" y="334" width="880" height="200" rx="12" fill="#eef4fa" stroke="#c9d8ea"/>
  <text x="60" y="360" fill="#0e5a8a" font-size="14" font-weight="700">部分和精度控制（防止溢出）</text>
  <g font-size="12.5">
    <text x="60" y="390" fill="#45536b">原始累加 18-bit；SRAM 只存 12-bit → 4 种模式选择动态范围：</text>
    <g>
      <rect x="70" y="404" width="60" height="26" rx="6" fill="#cfe0ee" stroke="#0e5a8a"/><text x="100" y="422" text-anchor="middle" fill="#0e5a8a" font-size="10">bit0–11</text>
      <rect x="146" y="404" width="60" height="26" rx="6" fill="#cfe0ee" stroke="#0e5a8a"/><text x="176" y="422" text-anchor="middle" fill="#0e5a8a" font-size="10">bit4–15</text>
      <rect x="222" y="404" width="60" height="26" rx="6" fill="#cfe0ee" stroke="#0e5a8a"/><text x="252" y="422" text-anchor="middle" fill="#0e5a8a" font-size="10">bit8–19</text>
      <rect x="298" y="404" width="60" height="26" rx="6" fill="#cfe0ee" stroke="#0e5a8a"/><text x="328" y="422" text-anchor="middle" fill="#0e5a8a" font-size="10">bit12–23</text>
      <text x="380" y="422" fill="#45536b" font-size="11">18-bit 窗口在 24-bit 域内滑动</text>
    </g>
    <text x="60" y="464" fill="#45536b">浅层通道少 → 用低 bit 段；深层通道多 → 用高位段（牺牲 LSB 防溢出）</text>
    <text x="60" y="488" fill="#45536b">最终输出量化 4-bit，动态范围用浮点缩放因子压缩；深层用更小缩放因子 → LSB 影响更小</text>
    <text x="60" y="512" fill="#1d8a5f" font-weight="600">设计哲学：把「精度」当作可调资源，按层分配，而不是一刀切全精度</text>
  </g>
</svg>
