<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="960" height="560" fill="#f6f8fb"/>
  <rect x="20" y="14" width="920" height="50" rx="10" fill="#0f1b2d"/>
  <text x="480" y="45" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">特征图四级数据结构：PixelPack → RowList → ColList → MapList</text>

  <!-- L1 pixelpack -->
  <rect x="40" y="84" width="430" height="130" rx="12" fill="#fff" stroke="#1d8a5f" stroke-width="2" filter="url(#sh)"/>
  <text x="60" y="110" fill="#1d8a5f" font-size="13.5" font-weight="700">L1 · PixelPack（最小存储单元）</text>
  <g font-size="11.5">
    <text x="60" y="136" fill="#45536b">同一 (x,y) 位置、32 个通道的像素打包 → 32×4b=128 bit</text>
    <text x="60" y="156" fill="#45536b">与 I/O SRAM 字长（128 bit）对齐 → 一次取一整包</text>
    <g>
      <rect x="70" y="170" width="16" height="18" fill="#d9f0e4" stroke="#1d8a5f"/><rect x="89" y="170" width="16" height="18" fill="#d9f0e4" stroke="#1d8a5f"/><rect x="108" y="170" width="16" height="18" fill="#d9f0e4" stroke="#1d8a5f"/>
      <text x="128" y="183" fill="#7f93ad">…</text>
      <rect x="136" y="170" width="16" height="18" fill="#d9f0e4" stroke="#1d8a5f"/>
      <text x="160" y="183" fill="#45536b">通道 0–31 的像素</text>
    </g>
    <text x="60" y="204" fill="#45536b">C&gt;32 时用多个 PixelPack 存同一坐标像素</text>
  </g>

  <!-- L2 rowlist -->
  <rect x="490" y="84" width="430" height="130" rx="12" fill="#fff" stroke="#0e5a8a" stroke-width="2" filter="url(#sh)"/>
  <text x="510" y="110" fill="#0e5a8a" font-size="13.5" font-weight="700">L2 · RowList（行方向线性结构）</text>
  <g font-size="11.5">
    <text x="510" y="136" fill="#45536b">同一 y 行的 PixelPack 排成线性链：含起始地址 + x 长度</text>
    <text x="510" y="156" fill="#45536b">线性取址即可覆盖大多数 CNN 层 → 简化内存管理</text>
    <g>
      <rect x="520" y="172" width="110" height="26" rx="6" fill="#cfe0ee" stroke="#0e5a8a"/>
      <text x="575" y="190" text-anchor="middle" fill="#0e5a8a" font-size="10">RowList: 起始地址</text>
      <rect x="650" y="172" width="60" height="26" rx="6" fill="#cfe0ee" stroke="#0e5a8a"/>
      <text x="680" y="190" text-anchor="middle" fill="#0e5a8a" font-size="10">x 长度</text>
      <rect x="730" y="172" width="60" height="26" rx="6" fill="#d9f0e4" stroke="#1d8a5f"/>
      <text x="760" y="190" text-anchor="middle" fill="#1d8a5f" font-size="10">PP0</text>
      <rect x="794" y="172" width="60" height="26" rx="6" fill="#d9f0e4" stroke="#1d8a5f"/>
      <text x="824" y="190" text-anchor="middle" fill="#1d8a5f" font-size="10">PP1</text>
      <text x="860" y="190" fill="#7f93ad">…</text>
    </g>
  </g>

  <!-- L3 collist -->
  <rect x="40" y="234" width="430" height="140" rx="12" fill="#fff" stroke="#f0a030" stroke-width="2" filter="url(#sh)"/>
  <text x="60" y="260" fill="#d08a10" font-size="13.5" font-weight="700">L3 · ColList（层调度最小操作单元）</text>
  <g font-size="11.5">
    <text x="60" y="286" fill="#45536b">特征图每 32 通道一组 → 一个 ColList；C=64 → 2 个 ColList</text>
    <text x="60" y="306" fill="#45536b">RowList 按「mod-3 同余」分布到 3 个 SRAM bank → 避免访问冲突</text>
    <text x="60" y="326" fill="#45536b">连续 3 行分到不同 bank → FX=FY=3 层每周期只访问单 bank</text>
    <g>
      <rect x="70" y="338" width="110" height="24" rx="6" fill="#fdeeda" stroke="#f0a030"/>
      <text x="125" y="355" text-anchor="middle" fill="#a06510" font-size="10">bank0: RL0, RL3…</text>
      <rect x="196" y="338" width="110" height="24" rx="6" fill="#fdeeda" stroke="#f0a030"/>
      <text x="251" y="355" text-anchor="middle" fill="#a06510" font-size="10">bank1: RL1, RL4…</text>
      <rect x="322" y="338" width="110" height="24" rx="6" fill="#fdeeda" stroke="#f0a030"/>
      <text x="377" y="355" text-anchor="middle" fill="#a06510" font-size="10">bank2: RL2, RL5…</text>
    </g>
  </g>

  <!-- L4 maplist -->
  <rect x="490" y="234" width="430" height="140" rx="12" fill="#fff" stroke="#6b3fa0" stroke-width="2" filter="url(#sh)"/>
  <text x="510" y="260" fill="#6b3fa0" font-size="13.5" font-weight="700">L4 · MapList（整个特征图）</text>
  <g font-size="11.5">
    <text x="510" y="286" fill="#45536b">不同输入通道的 ColList 分布到 SRAM 各处</text>
    <text x="510" y="306" fill="#45536b">完整 ColList 集合 = MapList = 整张特征图</text>
    <text x="510" y="330" fill="#1d8a5f" font-size="12" font-weight="600">一句话记忆：</text>
    <text x="510" y="352" fill="#45536b">「像素打包成包，包排成行，行归成列，列组成图」</text>
  </g>

  <!-- sliding window -->
  <rect x="40" y="394" width="880" height="140" rx="12" fill="#eef4fa" stroke="#c9d8ea"/>
  <text x="60" y="420" fill="#0e5a8a" font-size="14" font-weight="700">滑动窗口（sliding window）取数</text>
  <g font-size="12.5">
    <text x="60" y="448" fill="#45536b">3×3 卷积时：x 指针定位 RowList0/1/2 的 PixelPack，偏移由当前 x 坐标决定</text>
    <text x="60" y="472" fill="#45536b">三个深度的本地寄存器缓存 3 行数据 → 提供一次卷积所需的完整数据集（窗口数据复用）</text>
    <text x="60" y="496" fill="#45536b">相邻输出像素共享大量输入像素 → 滑动窗口把输入搬移最小化（输出移动优化）</text>
    <text x="60" y="520" fill="#1d8a5f" font-weight="600">部分和用「扩展 PixelPack」：3 个 bank 同地址的 3 个 PixelPack 合并（12-bit）；输出激活 4-bit 单 PixelPack</text>
  </g>
</svg>
