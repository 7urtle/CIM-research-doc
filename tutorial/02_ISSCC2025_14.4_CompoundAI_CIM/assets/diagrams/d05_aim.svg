<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0e5a8a"/>
    </marker>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="960" height="500" fill="#f6f8fb"/>
  <rect x="20" y="14" width="920" height="46" rx="10" fill="#0f1b2d"/>
  <text x="480" y="43" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">AIM（累加存内）：部分和/残差就地累加，不搬数据</text>

  <!-- 6T 单元 -->
  <rect x="40" y="80" width="420" height="300" rx="12" fill="#fff" stroke="#0e5a8a" stroke-width="2" filter="url(#sh)"/>
  <text x="60" y="108" fill="#0e5a8a" font-size="13.5" font-weight="700">6T 单元 + 解耦读/累加</text>
  <g font-size="11.5">
    <text x="60" y="140" fill="#45536b">数据存在 6T 单元里；N1/N2/N3 控制</text>
    <text x="60" y="162" fill="#45536b">“读出”和“累加”两条路径解耦：</text>
    <text x="60" y="192" fill="#45536b">存的内容 + CIM 送来的部分和/残差</text>
    <text x="60" y="214" fill="#45536b">在“伪行（pseudo-row）”里就地相加：</text>
    <text x="60" y="244" fill="#6b3fa0" font-weight="600">XOR 逻辑区分 INT / FP 模式；</text>
    <text x="60" y="266" fill="#45536b">INT：两个元素累加；FP：先比较指数对齐再累加</text>
    <text x="60" y="296" fill="#45536b">CWL+CIMEN 激活时：存 1 且 IN=1 → CBL 高</text>
    <text x="60" y="318" fill="#45536b">（AND 操作）；CBLB 对称做 NOR</text>
    <text x="60" y="348" fill="#1d8a5f" font-weight="600">→ 部分全加器复用 AND/NOR 结果 → 简化加法器</text>
  </g>

  <!-- 流程 -->
  <rect x="500" y="80" width="420" height="300" rx="12" fill="#fff" stroke="#6b3fa0" stroke-width="2" filter="url(#sh)"/>
  <text x="520" y="108" fill="#6b3fa0" font-size="13.5" font-weight="700">AIM 累加流程（伪行内）</text>
  <g font-size="11.5">
    <rect x="520" y="126" width="360" height="34" rx="6" fill="#eef7fd" stroke="#b8d9ee"/>
    <text x="700" y="147" text-anchor="middle" fill="#0e5a8a">CIM 部分和 / 残差输入</text>
    <path d="M700,160 V176" stroke="#0e5a8a" stroke-width="2" marker-end="url(#ar)"/>
    <rect x="520" y="180" width="360" height="34" rx="6" fill="#f5f0fc" stroke="#dcccf0"/>
    <text x="700" y="201" text-anchor="middle" fill="#6b3fa0">与存储值做 AND/NOR（位级逻辑）</text>
    <path d="M700,214 V230" stroke="#0e5a8a" stroke-width="2" marker-end="url(#ar)"/>
    <rect x="520" y="234" width="360" height="34" rx="6" fill="#fdf3e7" stroke="#e0a96a"/>
    <text x="700" y="255" text-anchor="middle" fill="#c25e2e">部分全加器（复用逻辑）求和</text>
    <path d="M700,268 V284" stroke="#0e5a8a" stroke-width="2" marker-end="url(#ar)"/>
    <rect x="520" y="288" width="360" height="34" rx="6" fill="#eefaf3" stroke="#bfe6d2"/>
    <text x="700" y="309" text-anchor="middle" fill="#1d8a5f">写回单元（就地完成累加）</text>
    <text x="520" y="352" fill="#45536b">FP32 模式：FA 输出用于对齐、累加与舍入</text>
    <text x="520" y="376" fill="#1d8a5f" font-weight="600">→ 数据不出内存 = 省搬移功耗</text>
  </g>

  <!-- 底部 -->
  <rect x="40" y="404" width="880" height="72" rx="10" fill="#eef4fa" stroke="#c9d8ea"/>
  <text x="60" y="432" fill="#0e5a8a" font-size="13" font-weight="700">收益</text>
  <text x="60" y="458" fill="#45536b" font-size="12.5">vs 全数字：INT32 省 38.3%、FP32 省 15.4% 功耗；部署在混合模型上：INT 模式系统功耗 −22.1%、FP 模式 −9.7%</text>
</svg>
