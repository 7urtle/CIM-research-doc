<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0e5a8a"/>
    </marker>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="960" height="520" fill="#f6f8fb"/>
  <rect x="20" y="14" width="920" height="46" rx="10" fill="#0f1b2d"/>
  <text x="480" y="43" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">异质 CIM 宏架构：16 个核部署 16 个专精模型</text>

  <!-- 16 核 -->
  <rect x="40" y="80" width="880" height="300" rx="12" fill="#fff" stroke="#0e5a8a" stroke-width="2" filter="url(#sh)"/>
  <text x="60" y="108" fill="#0e5a8a" font-size="13.5" font-weight="700">16 个异质 CIM 核（每个部署一个专精小模型）</text>
  <g font-size="10.5">
    <rect x="70" y="122" width="170" height="236" rx="10" fill="#eef7fd" stroke="#0e5a8a" stroke-width="1.5"/>
    <text x="155" y="142" text-anchor="middle" fill="#0e5a8a" font-weight="600">CIM 核（每个）</text>
    <rect x="84" y="152" width="142" height="34" rx="6" fill="#f5f0fc" stroke="#dcccf0"/>
    <text x="155" y="173" text-anchor="middle" fill="#6b3fa0">8 个 CIM-set</text>
    <rect x="84" y="194" width="142" height="34" rx="6" fill="#fdf3e7" stroke="#e0a96a"/>
    <text x="155" y="215" text-anchor="middle" fill="#c25e2e">核间加法器</text>
    <rect x="84" y="236" width="142" height="34" rx="6" fill="#eefaf3" stroke="#bfe6d2"/>
    <text x="155" y="257" text-anchor="middle" fill="#1d8a5f">0.5kb 累加存内 AIM</text>
    <text x="84" y="300" fill="#45536b">（部分和/残差就地累加）</text>
    <text x="84" y="330" fill="#45536b">CIM-set 内部：</text>
    <text x="84" y="348" fill="#45536b">· 1.375kb ME-CIM</text>
    <text x="84" y="364" fill="#45536b">· 4 并行 FP16 / 8 并行 FP8</text>
    <text x="84" y="380" fill="#45536b">· 0.25kb NIM + 动态启动器</text>
    <rect x="270" y="122" width="90" height="236" rx="10" fill="#eef7fd" stroke="#0e5a8a" stroke-width="1.5"/>
    <text x="315" y="142" text-anchor="middle" fill="#0e5a8a" font-weight="600">核1</text>
    <text x="315" y="240" text-anchor="middle" fill="#45536b">（部署模型 B）</text>
    <text x="380" y="240" text-anchor="middle" fill="#9aa8bd" font-size="14">……</text>
    <rect x="410" y="122" width="100" height="236" rx="10" fill="#eef7fd" stroke="#0e5a8a" stroke-width="1.5"/>
    <text x="460" y="142" text-anchor="middle" fill="#0e5a8a" font-weight="600">核 15</text>
    <text x="460" y="240" text-anchor="middle" fill="#45536b">（部署模型 P）</text>
    <text x="540" y="200" fill="#45536b">每核独立部署一个小模型，</text>
    <text x="540" y="224" fill="#45536b">核间通过“核间加法器”</text>
    <text x="540" y="248" fill="#45536b">融合输出（残差/组合）</text>
  </g>

  <!-- 底部 -->
  <rect x="40" y="400" width="880" height="96" rx="10" fill="#eef4fa" stroke="#c9d8ea"/>
  <text x="60" y="428" fill="#0e5a8a" font-size="13" font-weight="700">“全数据路径存内”的含义</text>
  <text x="60" y="454" fill="#45536b" font-size="12.5">MAC（ME-CIM）→ 路由（NIM）→ 累加（AIM）全部发生在内存里——</text>
  <text x="60" y="476" fill="#45536b" font-size="12.5">数据在“内存内部”完成整个计算链，只有最终结果出内存 → 搬移功耗最小化。</text>
</svg>
