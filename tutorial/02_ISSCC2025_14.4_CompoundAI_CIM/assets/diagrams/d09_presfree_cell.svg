<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="960" height="430" fill="#f6f8fb"/>
  <rect x="20" y="14" width="920" height="46" rx="10" fill="#0f1b2d"/>
  <text x="480" y="43" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">无预充电双端口位单元（10T）：稀疏数据的天选之子</text>

  <!-- 8T vs 10T -->
  <rect x="40" y="80" width="420" height="240" rx="12" fill="#fff" stroke="#c25e2e" stroke-width="2" filter="url(#sh)"/>
  <text x="60" y="108" fill="#c25e2e" font-size="13.5" font-weight="700">传统 8T 双端口单元</text>
  <g font-size="12">
    <text x="60" y="140" fill="#45536b">• 读前要把位线（RBL）<strong>预充电</strong>到高电平</text>
    <text x="60" y="164" fill="#45536b">• 预充电本身耗电（每个周期都做）</text>
    <text x="60" y="196" fill="#c25e2e" font-weight="600">→ 即使读的是 0（RBL 不动），</text>
    <text x="60" y="218" fill="#c25e2e" font-weight="600">预充电功耗也照花</text>
  </g>

  <rect x="500" y="80" width="420" height="240" rx="12" fill="#fff" stroke="#1d8a5f" stroke-width="2" filter="url(#sh)"/>
  <text x="520" y="108" fill="#1d8a5f" font-size="13.5" font-weight="700">本文 10T 无预充电单元</text>
  <g font-size="12">
    <text x="520" y="140" fill="#45536b">• 用<strong>反相器</strong>替代预充电电路</text>
    <text x="520" y="164" fill="#45536b">• 只在 RBL 电压<strong>变化</strong>时才消耗充放电功耗</text>
    <text x="520" y="196" fill="#1d8a5f" font-weight="600">→ 连续读 0（RBL 不动）→ 零功耗</text>
    <text x="520" y="218" fill="#1d8a5f" font-weight="600">→ 稀疏数据（大部分是 0）天然省电</text>
    <text x="520" y="252" fill="#45536b">代价：面积是 8T 的 1.26 倍</text>
  </g>

  <!-- 底部 -->
  <rect x="40" y="344" width="880" height="62" rx="10" fill="#eef4fa" stroke="#c9d8ea"/>
  <text x="60" y="372" fill="#0e5a8a" font-size="13" font-weight="700">与稀疏加速的配合</text>
  <text x="60" y="394" fill="#45536b" font-size="12.5">NIM/动态启动器把非零项挑出来算，读到的数据流天然稀疏（很多 0）→ 10T 单元的“0 不耗电”特性</text>
  <text x="60" y="406" fill="#45536b" font-size="12.5">正好匹配 → 实测功率比 8T 好 1.95×（面积 +1.26×），是本宏 51.6 TFLOPS/W 峰值能效的关键拼图</text>
</svg>
