<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="960" height="470" fill="#f6f8fb"/>
  <rect x="20" y="14" width="920" height="50" rx="10" fill="#0f1b2d"/>
  <text x="480" y="45" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">精度与能效的拔河：为什么边缘 AI 需要浮点（FP）存内计算</text>

  <!-- 左侧：INT8 -->
  <text x="250" y="94" text-anchor="middle" fill="#0e5a8a" font-size="16" font-weight="700">整数（INT8）路线</text>
  <rect x="40" y="108" width="420" height="200" rx="12" fill="#fff" stroke="#0e5a8a" stroke-width="2" filter="url(#sh)"/>
  <g font-size="12.5">
    <text x="60" y="140" fill="#1a2332" font-weight="600">优点：</text>
    <text x="60" y="164" fill="#45536b">• 乘法器小、省电（8b×8b 很便宜）</text>
    <text x="60" y="186" fill="#45536b">• 与 CIM 结构天然契合（整数直接乘累加）</text>
    <text x="60" y="216" fill="#c25e2e" font-weight="600">缺点：</text>
    <text x="60" y="240" fill="#45536b">• 训练/微调需要高精度，INT8 精度不足</text>
    <text x="60" y="262" fill="#45536b">• 模型越来越大，低比特量化掉精度</text>
    <text x="60" y="292" fill="#0e5a8a" font-weight="600">→ 只适合“纯推理 + 已量化好”的场景</text>
  </g>

  <!-- 右侧：FP -->
  <text x="710" y="94" text-anchor="middle" fill="#c25e2e" font-size="16" font-weight="700">浮点（FP）路线</text>
  <rect x="500" y="108" width="420" height="200" rx="12" fill="#fff" stroke="#c25e2e" stroke-width="2" filter="url(#sh)"/>
  <g font-size="12.5">
    <text x="520" y="140" fill="#1a2332" font-weight="600">优点：</text>
    <text x="520" y="164" fill="#45536b">• 动态范围大、精度高 → 训练/高精度推理</text>
    <text x="520" y="186" fill="#45536b">• Transformer/ViT 等对精度敏感的网络必需</text>
    <text x="520" y="216" fill="#c25e2e" font-weight="600">缺点：</text>
    <text x="520" y="240" fill="#45536b">• 乘法前要“指数对齐”，加法树又贵又复杂</text>
    <text x="520" y="262" fill="#45536b">• 与 CIM 结构不友好（见 d02/d03）</text>
    <text x="520" y="292" fill="#c25e2e" font-weight="600">→ 需要专门的 FP-CIM 架构来解决</text>
  </g>

  <!-- 中间结论 -->
  <rect x="40" y="330" width="880" height="116" rx="10" fill="#eef4fa" stroke="#c9d8ea"/>
  <text x="60" y="358" fill="#0e5a8a" font-size="13.5" font-weight="700">本论文的立场</text>
  <text x="60" y="384" fill="#45536b" font-size="12.5">FP-CIM 的目标：<strong>保留浮点精度（BF16/FP32 累加），同时把能效做到接近整数 CIM</strong>。</text>
  <text x="60" y="406" fill="#45536b" font-size="12.5">论文实测：BF16 模式 62.84 TFLOPS/W、INT8 模式 90.15 TOPS/W、FP32 输出、28nm。</text>
  <text x="60" y="430" fill="#45536b" font-size="12.5">三个手段：① 广播输入+轻量转换器（复用性）② 嵌入式 2b 串行对齐（省面积）③ 非二进制补码 MAC（省功耗）。</text>
</svg>
