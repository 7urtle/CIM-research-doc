<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="960" height="430" fill="#f6f8fb"/>
  <rect x="20" y="14" width="920" height="46" rx="10" fill="#0f1b2d"/>
  <text x="480" y="43" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">2b 串行对齐的时间线：SDT 倒计时，LC 按 SHIFT 存/移</text>

  <!-- 时间轴 -->
  <line x1="80" y1="120" x2="900" y2="120" stroke="#45536b" stroke-width="2"/>
  <g font-size="11">
    <line x1="160" y1="114" x2="160" y2="126" stroke="#45536b" stroke-width="1.4"/>
    <text x="160" y="142" text-anchor="middle" fill="#6b7a93">周期0</text>
    <line x1="340" y1="114" x2="340" y2="126" stroke="#45536b" stroke-width="1.4"/>
    <text x="340" y="142" text-anchor="middle" fill="#6b7a93">周期1</text>
    <line x1="520" y1="114" x2="520" y2="126" stroke="#45536b" stroke-width="1.4"/>
    <text x="520" y="142" text-anchor="middle" fill="#6b7a93">周期2</text>
    <line x1="700" y1="114" x2="700" y2="126" stroke="#45536b" stroke-width="1.4"/>
    <text x="700" y="142" text-anchor="middle" fill="#6b7a93">周期3</text>
  </g>

  <!-- SDT 递减 -->
  <text x="80" y="86" fill="#0e5a8a" font-size="13" font-weight="600">SDT（移位目标跟踪器）</text>
  <rect x="160" y="72" width="180" height="24" rx="5" fill="#fdf3e7" stroke="#e0a96a"/>
  <text x="250" y="88" text-anchor="middle" fill="#c25e2e" font-size="11.5">SDT = 最大值 SUM</text>
  <rect x="340" y="72" width="180" height="24" rx="5" fill="#fdf3e7" stroke="#e0a96a"/>
  <text x="430" y="88" text-anchor="middle" fill="#c25e2e" font-size="11.5">SDT − 1</text>
  <rect x="520" y="72" width="180" height="24" rx="5" fill="#fdf3e7" stroke="#e0a96a"/>
  <text x="610" y="88" text-anchor="middle" fill="#c25e2e" font-size="11.5">SDT − 2</text>
  <rect x="700" y="72" width="180" height="24" rx="5" fill="#fdf3e7" stroke="#e0a96a"/>
  <text x="790" y="88" text-anchor="middle" fill="#c25e2e" font-size="11.5">SDT − 3</text>

  <!-- 三个 LC 示例 -->
  <text x="80" y="180" fill="#6b3fa0" font-size="13" font-weight="600">LC 行为（示例：三个输入的对齐差距不同）</text>
  <g font-size="11">
    <rect x="80" y="196" width="180" height="34" rx="6" fill="#eefaf3" stroke="#bfe6d2"/>
    <text x="170" y="217" text-anchor="middle" fill="#1d8a5f">LC0：差距 0 → 一直存</text>
    <rect x="80" y="244" width="180" height="34" rx="6" fill="#f5f0fc" stroke="#dcccf0"/>
    <text x="170" y="265" text-anchor="middle" fill="#6b3fa0">LC1：差距 2 → 先存后移</text>
    <rect x="80" y="292" width="180" height="34" rx="6" fill="#fdf3e7" stroke="#e0a96a"/>
    <text x="170" y="313" text-anchor="middle" fill="#c25e2e">LC2：差距 4 → 存3移1</text>
  </g>

  <!-- 右：解释 -->
  <rect x="320" y="180" width="600" height="180" rx="10" fill="#fff" stroke="#dfe6f0" filter="url(#sh)"/>
  <text x="340" y="206" fill="#123a57" font-size="13" font-weight="700">工作过程（BF16 模式）</text>
  <text x="340" y="234" fill="#45536b" font-size="12">① EA 算出 16 个“输入指数+权重指数”的和；</text>
  <text x="340" y="258" fill="#45536b" font-size="12">② MVF 找最大和 → SDT 从最大值开始每周期 −1；</text>
  <text x="340" y="282" fill="#45536b" font-size="12">③ 每个 EC 比较 SDT 与自己的 SUM[8:1]：相等前 = 存储态（把尾数最小位存进 ARRC），</text>
  <text x="340" y="306" fill="#45536b" font-size="12">　　相等后 = 移位态（每周期输出 2b 已存尾数）；</text>
  <text x="340" y="330" fill="#45536b" font-size="12">④ OSIU 做符号处理 {~LIN[m-1], LIN[m-2:0]} 输出 LIN[1:0]。</text>
  <text x="340" y="354" fill="#0e5a8a" font-weight="600">→ 全部输入在“同一个节奏”下对齐，无需逐个桶形移位</text>
</svg>
