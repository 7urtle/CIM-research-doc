<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="960" height="470" fill="#f6f8fb"/>
  <rect x="20" y="14" width="920" height="46" rx="10" fill="#0f1b2d"/>
  <text x="480" y="43" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">SpG 工作流与访问张量重排序（最大化局部性）</text>

  <!-- 访问张量 -->
  <rect x="40" y="80" width="420" height="200" rx="12" fill="#fff" stroke="#0e5a8a" stroke-width="2" filter="url(#sh)"/>
  <text x="60" y="108" fill="#0e5a8a" font-size="13.5" font-weight="700">访问张量（Access Tensor）</text>
  <g font-size="11.5">
    <text x="60" y="140" fill="#45536b">每行 = 一次“采集-归约”操作，1 表示需要的特征位置：</text>
    <g transform="translate(70,150)">
      <g stroke="#0e5a8a" stroke-width="0.8" fill="#eef7fd">
        <rect x="0" y="0" width="30" height="22"/><rect x="32" y="0" width="30" height="22" fill="#fdf3e7"/><rect x="64" y="0" width="30" height="22"/><rect x="96" y="0" width="30" height="22"/>
        <rect x="0" y="24" width="30" height="22"/><rect x="32" y="24" width="30" height="22"/><rect x="64" y="24" width="30" height="22" fill="#fdf3e7"/><rect x="96" y="24" width="30" height="22"/>
      </g>
      <text x="8" y="15" text-anchor="middle" fill="#0e5a8a" font-size="9">1</text>
      <text x="72" y="15" text-anchor="middle" fill="#0e5a8a" font-size="9">1</text>
      <text x="40" y="39" text-anchor="middle" fill="#0e5a8a" font-size="9">1</text>
      <text x="104" y="39" text-anchor="middle" fill="#0e5a8a" font-size="9">1</text>
    </g>
    <text x="60" y="220" fill="#45536b">GCN：图邻接矩阵　DLRM：用户-物品交互矩阵</text>
    <text x="60" y="244" fill="#45536b">强局部性：社区内顶点/相似用户偏好集中访问</text>
    <text x="60" y="266" fill="#0e5a8a" font-weight="600">→ 重排（reorder）让相似行相邻，聚类后分组给各芯粒</text>
  </g>

  <!-- 重排效果 -->
  <rect x="500" y="80" width="420" height="200" rx="12" fill="#fff" stroke="#6b3fa0" stroke-width="2" filter="url(#sh)"/>
  <text x="520" y="108" fill="#6b3fa0" font-size="13.5" font-weight="700">重排前 vs 重排后（Fig. 7a）</text>
  <g font-size="10.5">
    <g transform="translate(520,122)">
      <g stroke="#9aa8bd" stroke-width="0.8">
        <rect x="0" y="0" width="22" height="22" fill="#eef7fd"/><rect x="24" y="0" width="22" height="22" fill="#eef7fd"/><rect x="48" y="0" width="22" height="22" fill="#eef7fd"/><rect x="72" y="0" width="22" height="22" fill="#eef7fd"/>
        <rect x="0" y="24" width="22" height="22" fill="#eef7fd"/><rect x="24" y="24" width="22" height="22" fill="#eef7fd"/><rect x="48" y="24" width="22" height="22" fill="#eef7fd"/><rect x="72" y="24" width="22" height="22" fill="#eef7fd"/>
      </g>
      <g fill="#f0b446" opacity="0.75">
        <rect x="1" y="1" width="20" height="20"/><rect x="23" y="1" width="20" height="20"/>
        <rect x="1" y="25" width="20" height="20"/>
        <rect x="47" y="25" width="20" height="20"/><rect x="69" y="25" width="20" height="20"/>
      </g>
      <text x="2" y="14" text-anchor="middle" fill="#45536b" font-size="8">f0</text>
      <text x="24" y="14" text-anchor="middle" fill="#45536b" font-size="8">f1</text>
      <text x="2" y="38" text-anchor="middle" fill="#45536b" font-size="8">f2</text>
      <text x="48" y="38" text-anchor="middle" fill="#45536b" font-size="8">f4</text>
      <text x="70" y="38" text-anchor="middle" fill="#45536b" font-size="8">f5</text>
    </g>
    <text x="600" y="180" fill="#45536b">左：访问分散（大量跨芯粒）</text>
    <text x="600" y="204" fill="#1d8a5f" font-weight="600">右：橙块沿对角集中 → 本芯粒 DRAM 访问</text>
    <text x="600" y="236" fill="#45536b">特征按芯粒访问模式重分布（Fig. 7a 右）</text>
    <text x="600" y="260" fill="#1d8a5f" font-weight="600">→ 跨芯粒访问大幅减少</text>
  </g>

  <!-- 底部 -->
  <rect x="40" y="304" width="880" height="142" rx="10" fill="#eef4fa" stroke="#c9d8ea"/>
  <text x="60" y="332" fill="#0e5a8a" font-size="13.5" font-weight="700">REGM 架构（Fig. 9）</text>
  <g font-size="12">
    <text x="60" y="360" fill="#45536b">• <strong>高频特征过滤器</strong>：统计未来访问次数，超过阈值 → 留在 CIM；低频 → 驱逐候选 FIFO（地址仅 8b）；</text>
    <text x="60" y="384" fill="#45536b">• <strong>归约冗余推测器</strong>：统计归约结果的未来复用次数 → 高复用结果（如 f0+f3）存入 CIM；</text>
    <text x="60" y="408" fill="#45536b">• <strong>归约复用生成器</strong>：生成配置 → 后续采集直接复用已存结果，省重复归约；</text>
    <text x="60" y="430" fill="#45536b">• 开销：REGM 仅占面积 0.3%、功耗 0.2%（评估版）。</text>
    <text x="60" y="452" fill="#1d8a5f" font-weight="600">→ 实测：DRAM 访问 −1.74×、跨芯粒访问 −3.55×、归约数 −1.35×（GCN Pubmed）</text>
  </g>
</svg>
