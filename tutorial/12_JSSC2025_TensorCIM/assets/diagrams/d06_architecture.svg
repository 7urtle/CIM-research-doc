<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0e5a8a"/>
    </marker>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="960" height="480" fill="#f6f8fb"/>
  <rect x="20" y="14" width="920" height="46" rx="10" fill="#0f1b2d"/>
  <text x="480" y="43" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">TensorCIM 芯粒架构与 MCM 系统</text>

  <!-- 芯粒 -->
  <rect x="60" y="90" width="520" height="300" rx="12" fill="#fff" stroke="#0e5a8a" stroke-width="2" filter="url(#sh)"/>
  <text x="80" y="118" fill="#0e5a8a" font-size="13.5" font-weight="700">TensorCIM 芯粒（图 5）</text>
  <g font-size="10.5">
    <rect x="80" y="132" width="150" height="50" rx="8" fill="#eef7fd" stroke="#b8d9ee"/>
    <text x="155" y="152" text-anchor="middle" fill="#0e5a8a" font-weight="600">8 × ILA-CIM 核</text>
    <text x="155" y="170" text-anchor="middle" fill="#45536b">（含输入前瞻/FP 对齐/输出合并）</text>
    <rect x="250" y="132" width="150" height="50" rx="8" fill="#fdf3e7" stroke="#e0a96a"/>
    <text x="325" y="152" text-anchor="middle" fill="#c25e2e" font-weight="600">8 × REGM</text>
    <text x="325" y="170" text-anchor="middle" fill="#45536b">（冗余消除采集管理）</text>
    <rect x="420" y="132" width="140" height="50" rx="8" fill="#f5f0fc" stroke="#dcccf0"/>
    <text x="490" y="152" text-anchor="middle" fill="#6b3fa0" font-weight="600">EOCI</text>
    <text x="490" y="170" text-anchor="middle" fill="#45536b">（等操作初始化）</text>
    <rect x="80" y="196" width="200" height="44" rx="8" fill="#eefaf3" stroke="#bfe6d2"/>
    <text x="180" y="218" text-anchor="middle" fill="#1d8a5f" font-weight="600">256kB 输入缓冲 + 256kB 全局缓冲</text>
    <rect x="300" y="196" width="260" height="44" rx="8" fill="#eefaf3" stroke="#bfe6d2"/>
    <text x="430" y="218" text-anchor="middle" fill="#1d8a5f">SIMD 核 + 顶层控制器</text>
    <text x="80" y="272" fill="#45536b">三种数据流（复用同一数据通路）：</text>
    <text x="80" y="294" fill="#45536b">· SpG 模式：CIM 采集（REGM 管理高频特征/归约结果）</text>
    <text x="80" y="316" fill="#45536b">· SpA 初始化：EOCI 平衡负载</text>
    <text x="80" y="338" fill="#45536b">· SpA 计算：ILA-CIM 前瞻输入</text>
    <text x="80" y="372" fill="#45536b">支持 INT8/INT16/FP32（INT 通过旁路指数处理实现）</text>
  </g>

  <!-- MCM -->
  <rect x="620" y="90" width="300" height="300" rx="12" fill="#fff" stroke="#6b3fa0" stroke-width="2" filter="url(#sh)"/>
  <text x="640" y="118" fill="#6b3fa0" font-size="13.5" font-weight="700">MCM-CIM 系统（4 芯粒）</text>
  <g font-size="10.5">
    <rect x="640" y="132" width="60" height="50" rx="6" fill="#f5f0fc" stroke="#dcccf0"/><text x="670" y="157" text-anchor="middle" fill="#6b3fa0">芯粒0</text>
    <rect x="710" y="132" width="60" height="50" rx="6" fill="#f5f0fc" stroke="#dcccf0"/><text x="740" y="157" text-anchor="middle" fill="#6b3fa0">芯粒1</text>
    <rect x="640" y="196" width="60" height="50" rx="6" fill="#f5f0fc" stroke="#dcccf0"/><text x="670" y="221" text-anchor="middle" fill="#6b3fa0">芯粒2</text>
    <rect x="710" y="196" width="60" height="50" rx="6" fill="#f5f0fc" stroke="#dcccf0"/><text x="740" y="221" text-anchor="middle" fill="#6b3fa0">芯粒3</text>
    <text x="640" y="272" fill="#45536b">· 每个芯粒用自己的 DRAM 通道</text>
    <text x="640" y="294" fill="#45536b">· 芯粒间带宽受限（320Mb/s）</text>
    <text x="640" y="316" fill="#45536b">· 访问张量重排 → 尽量本地化</text>
    <text x="640" y="338" fill="#45536b">· 高良率：坏芯粒可替换</text>
    <text x="640" y="360" fill="#45536b">· 不同工艺节点混搭、按需增减</text>
  </g>

  <!-- 底部 -->
  <rect x="60" y="410" width="860" height="46" rx="10" fill="#eef4fa" stroke="#c9d8ea"/>
  <text x="490" y="430" text-anchor="middle" fill="#0e5a8a" font-size="12.5" font-weight="600">28nm 单芯粒 3.88×3.20mm² · 0.6~1.0V · 115~290MHz · 29.10~166.84mW</text>
  <text x="490" y="449" text-anchor="middle" fill="#45536b" font-size="12">4 芯粒峰值：3.56 TOPS(INT8) / 0.59 TOPS(INT16) / 0.37 TFLOPS(FP32)</text>
</svg>
