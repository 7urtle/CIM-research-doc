<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="960" height="430" fill="#f6f8fb"/>
  <rect x="20" y="14" width="920" height="46" rx="10" fill="#0f1b2d"/>
  <text x="480" y="43" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">冗余消除采集（CIM Gathering）：高频特征与归约结果“住进”CIM</text>

  <!-- 案例 -->
  <rect x="40" y="80" width="440" height="260" rx="12" fill="#fff" stroke="#1d8a5f" stroke-width="2" filter="url(#sh)"/>
  <text x="60" y="108" fill="#1d8a5f" font-size="13.5" font-weight="700">Chiplet0 案例（Fig. 8）</text>
  <g font-size="11.5">
    <text x="60" y="140" fill="#45536b">访问张量显示 f0、f1、f3 被高频访问，</text>
    <text x="60" y="162" fill="#45536b">f0+f3 的归约结果被高频复用：</text>
    <g transform="translate(60,172)">
      <g stroke="#1d8a5f" stroke-width="0.8" fill="#eefaf3">
        <rect x="0" y="0" width="60" height="34"/><rect x="66" y="0" width="60" height="34"/><rect x="132" y="0" width="60" height="34"/>
        <rect x="0" y="40" width="60" height="34"/><rect x="66" y="40" width="60" height="34"/><rect x="132" y="40" width="60" height="34"/>
      </g>
      <text x="30" y="17" text-anchor="middle" fill="#1d8a5f" font-size="11">f0</text>
      <text x="96" y="17" text-anchor="middle" fill="#1d8a5f" font-size="11">f1</text>
      <text x="162" y="17" text-anchor="middle" fill="#1d8a5f" font-size="11">f3</text>
      <text x="96" y="57" text-anchor="middle" fill="#1d8a5f" font-size="11">f0+f3</text>
    </g>
    <text x="60" y="252" fill="#1d8a5f" font-weight="600">→ 这些特征/归约结果维护在 CIM 里</text>
    <text x="60" y="276" fill="#45536b">→ 后续采集直接从 CIM 读，不再访问 DRAM/跨芯粒</text>
    <text x="60" y="306" fill="#45536b">→ 重复归约（f0+f3）直接复用，不再重算</text>
  </g>

  <!-- 流程 -->
  <rect x="500" y="80" width="420" height="260" rx="12" fill="#fff" stroke="#0e5a8a" stroke-width="2" filter="url(#sh)"/>
  <text x="520" y="108" fill="#0e5a8a" font-size="13.5" font-weight="700">REG 工作流程（Fig. 7b）</text>
  <g font-size="11.5">
    <rect x="520" y="122" width="120" height="34" rx="6" fill="#eef7fd" stroke="#b8d9ee"/>
    <text x="580" y="143" text-anchor="middle" fill="#0e5a8a">需要特征 f？</text>
    <rect x="660" y="122" width="120" height="34" rx="6" fill="#eefaf3" stroke="#bfe6d2"/>
    <text x="720" y="143" text-anchor="middle" fill="#1d8a5f">在 CIM 里吗？</text>
    <text x="520" y="186" fill="#45536b">在 → 直接读 CIM（零 DRAM/跨芯粒访问）</text>
    <text x="520" y="210" fill="#45536b">不在 → 触发 REGM：从 DRAM/其他芯粒取</text>
    <text x="520" y="232" fill="#45536b">　　→ 更新 CIM 存储（驱逐低频特征）</text>
    <text x="520" y="262" fill="#45536b">需要归约 f2+f3？→ 已存则直接复用结果</text>
    <text x="520" y="290" fill="#1d8a5f" font-weight="600">→ 用“时间局部性”换“带宽与算力”</text>
  </g>

  <!-- 底部 -->
  <rect x="40" y="364" width="880" height="42" rx="10" fill="#eef4fa" stroke="#c9d8ea"/>
  <text x="480" y="390" text-anchor="middle" fill="#0e5a8a" font-size="12.5" font-weight="600">实测（GCN Pubmed 四芯粒）：DRAM 访问 −1.74× · 跨芯粒访问 −3.55× · 归约数 −1.35×</text>
</svg>
