<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="960" height="560" fill="#f6f8fb"/>
  <rect x="20" y="14" width="920" height="46" rx="10" fill="#0f1b2d"/>
  <text x="480" y="43" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">数据映射策略：时间步（TS）与输入（IN）谁先谁后，代价完全不同</text>

  <!-- 公共概念 -->
  <rect x="40" y="76" width="880" height="52" rx="10" fill="#eef7fd" stroke="#b8d9ee"/>
  <text x="60" y="100" fill="#0e5a8a" font-size="12.5" font-weight="600">SNN 按“时间步（timestep, TS）”处理：每个 TS 进来一批脉冲。设共有 K 个输入神经元、N 个 TS。</text>
  <text x="60" y="120" fill="#45536b" font-size="12">两个极端策略：要么“一个 TS 内扫完所有输入”（省 PSUM 存储），要么“一个输入扫完所有 TS”（省权重更新）</text>

  <!-- TS-first -->
  <text x="250" y="158" text-anchor="middle" fill="#c25e2e" font-size="14.5" font-weight="700">① 时间步优先（TS-first，传统）</text>
  <rect x="40" y="168" width="420" height="150" rx="10" fill="#fff" stroke="#e0a96a" stroke-width="1.8" filter="url(#sh)"/>
  <g font-size="11">
    <rect x="60" y="190" width="80" height="30" rx="5" fill="#fdf3e7" stroke="#e0a96a"/><text x="100" y="210" text-anchor="middle" fill="#c25e2e">TS0</text>
    <rect x="60" y="230" width="80" height="30" rx="5" fill="#fdf3e7" stroke="#e0a96a"/><text x="100" y="250" text-anchor="middle" fill="#c25e2e">TS1</text>
    <rect x="60" y="270" width="80" height="30" rx="5" fill="#fdf3e7" stroke="#e0a96a"/><text x="100" y="290" text-anchor="middle" fill="#c25e2e">…</text>
    <text x="160" y="200" fill="#45536b">IN0, IN1, …, INK 顺序访问（K 次读取）</text>
    <text x="160" y="222" fill="#45536b">每访问一个 IN 都要把对应权重读出来</text>
    <text x="160" y="244" fill="#c25e2e">→ 权重反复读、更新能耗高、延迟长</text>
    <text x="160" y="266" fill="#1d8a5f">→ 但每个 TS 的结果立刻累加，PSUM 存储最小</text>
    <text x="160" y="290" fill="#6b7a93">W 更新能耗 ★★★★★ · PSUM 存储 ★☆☆☆☆</text>
  </g>

  <!-- Weight-reuse-first -->
  <text x="710" y="158" text-anchor="middle" fill="#6b3fa0" font-size="14.5" font-weight="700">② 权重复用优先（Weight-reuse-first）</text>
  <rect x="500" y="168" width="420" height="150" rx="10" fill="#fff" stroke="#dcccf0" stroke-width="1.8" filter="url(#sh)"/>
  <g font-size="11">
    <rect x="520" y="190" width="80" height="30" rx="5" fill="#f5f0fc" stroke="#dcccf0"/><text x="560" y="210" text-anchor="middle" fill="#6b3fa0">IN0</text>
    <rect x="520" y="230" width="80" height="30" rx="5" fill="#f5f0fc" stroke="#dcccf0"/><text x="560" y="250" text-anchor="middle" fill="#6b3fa0">IN1</text>
    <rect x="520" y="270" width="80" height="30" rx="5" fill="#f5f0fc" stroke="#dcccf0"/><text x="560" y="290" text-anchor="middle" fill="#6b3fa0">…</text>
    <text x="620" y="200" fill="#45536b">同一 IN 在所有 TS0..N 上访问（N 次）</text>
    <text x="620" y="222" fill="#45536b">权重只需读一次、被 N 个 TS 复用</text>
    <text x="620" y="244" fill="#1d8a5f">→ 权重更新能耗低、吞吐高</text>
    <text x="620" y="266" fill="#c25e2e">→ 但不同 TS 的结果要跨 TS 累加 → PSUM 存储爆炸</text>
    <text x="620" y="290" fill="#6b7a93">W 更新能耗 ★☆☆☆☆ · PSUM 存储 ★★★★★</text>
  </g>

  <!-- 折中 -->
  <rect x="40" y="336" width="880" height="120" rx="12" fill="#eefaf3" stroke="#bfe6d2"/>
  <text x="60" y="364" fill="#1d8a5f" font-size="14" font-weight="700">③ 本论文 PS-WR-ODM：块内权重复用（折中）</text>
  <text x="60" y="390" fill="#45536b" font-size="12.5">把 TS 分成“用户可定义大小的块”（例如相邻 2 个 TS 一组），在<strong>块内</strong>做权重复用映射：</text>
  <g font-size="11">
    <rect x="60" y="404" width="60" height="26" rx="5" fill="#eefaf3" stroke="#1d8a5f"/><text x="90" y="421" text-anchor="middle" fill="#1d8a5f">TS0-1</text>
    <rect x="130" y="404" width="60" height="26" rx="5" fill="#eefaf3" stroke="#1d8a5f"/><text x="160" y="421" text-anchor="middle" fill="#1d8a5f">TS2-3</text>
    <rect x="200" y="404" width="60" height="26" rx="5" fill="#eefaf3" stroke="#1d8a5f"/><text x="230" y="421" text-anchor="middle" fill="#1d8a5f">TS4-5</text>
    <text x="280" y="421" fill="#45536b">每个块内部：IN 跨块内 TS 复用权重；块之间：重新加载权重</text>
    <text x="60" y="448" fill="#1d8a5f" font-weight="600">→ 权重更新能耗与延迟接近“复用优先”，PSUM 缓冲只增加“一点点”（块大小可控）</text>
  </g>

  <rect x="40" y="474" width="880" height="64" rx="10" fill="#eef4fa" stroke="#c9d8ea"/>
  <text x="480" y="500" text-anchor="middle" fill="#0e5a8a" font-size="13" font-weight="700">FoM1 = 能效 /（面积 × 延迟）：PS-WR-ODM 比两种极端方案好 &gt;1.22×</text>
  <text x="480" y="524" text-anchor="middle" fill="#45536b" font-size="12">本质：把“时间步维度”和“输入维度”的遍历顺序做成可调参数，按模型/负载取折中</text>
</svg>
