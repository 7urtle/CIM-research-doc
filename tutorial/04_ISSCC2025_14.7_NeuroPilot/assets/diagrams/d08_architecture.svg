<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0e5a8a"/>
    </marker>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="960" height="480" fill="#f6f8fb"/>
  <rect x="20" y="14" width="920" height="46" rx="10" fill="#0f1b2d"/>
  <text x="480" y="43" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">NeuroPilot 宏架构与三阶段工作流</text>

  <!-- 阵列 -->
  <rect x="60" y="90" width="500" height="300" rx="12" fill="#fff" stroke="#0e5a8a" stroke-width="2" filter="url(#sh)"/>
  <text x="80" y="118" fill="#0e5a8a" font-size="13.5" font-weight="700">32×32 Pilot PE 阵列</text>
  <g font-size="10">
    <g transform="translate(80,132)">
      <g stroke="#0e5a8a" stroke-width="0.7">
        <rect x="0" y="0" width="26" height="26" fill="#eef7fd"/><rect x="28" y="0" width="26" height="26" fill="#eef7fd"/><rect x="56" y="0" width="26" height="26" fill="#eef7fd"/><rect x="84" y="0" width="26" height="26" fill="#eef7fd"/>
        <rect x="0" y="28" width="26" height="26" fill="#eef7fd"/><rect x="28" y="28" width="26" height="26" fill="#eef7fd"/><rect x="56" y="28" width="26" height="26" fill="#fdf3e7"/><rect x="84" y="28" width="26" height="26" fill="#eef7fd"/>
        <rect x="0" y="56" width="26" height="26" fill="#eef7fd"/><rect x="28" y="56" width="26" height="26" fill="#eef7fd"/><rect x="56" y="56" width="26" height="26" fill="#eef7fd"/><rect x="84" y="56" width="26" height="26" fill="#eef7fd"/>
        <rect x="0" y="84" width="26" height="26" fill="#eef7fd"/><rect x="28" y="84" width="26" height="26" fill="#eef7fd"/><rect x="56" y="84" width="26" height="26" fill="#eef7fd"/><rect x="84" y="84" width="26" height="26" fill="#eef7fd"/>
      </g>
      <circle cx="13" cy="13" r="6" fill="#1d8a5f"/>
      <circle cx="97" cy="97" r="6" fill="#c25e2e"/>
      <rect x="54" y="26" width="28" height="28" fill="#45536b"/>
      <text x="110" y="120" fill="#6b7a93">（32×32 示意）</text>
    </g>
  </g>

  <!-- 外围 -->
  <rect x="600" y="90" width="320" height="300" rx="12" fill="#fff" stroke="#6b3fa0" stroke-width="2" filter="url(#sh)"/>
  <text x="620" y="118" fill="#6b3fa0" font-size="13.5" font-weight="700">外围电路</text>
  <g font-size="11">
    <rect x="620" y="132" width="140" height="34" rx="6" fill="#f5f0fc" stroke="#dcccf0"/>
    <text x="690" y="153" text-anchor="middle" fill="#6b3fa0">WL/BL 驱动 + IO</text>
    <rect x="770" y="132" width="140" height="34" rx="6" fill="#f5f0fc" stroke="#dcccf0"/>
    <text x="840" y="153" text-anchor="middle" fill="#6b3fa0">行列译码器</text>
    <rect x="620" y="176" width="140" height="34" rx="6" fill="#eefaf3" stroke="#bfe6d2"/>
    <text x="690" y="197" text-anchor="middle" fill="#1d8a5f">OPC 预充电电路</text>
    <rect x="770" y="176" width="140" height="34" rx="6" fill="#fdf3e7" stroke="#e0a96a"/>
    <text x="840" y="197" text-anchor="middle" fill="#c25e2e">主控制器</text>
    <text x="620" y="250" fill="#45536b">行/列反馈 → 行列编码器</text>
    <text x="620" y="274" fill="#45536b">→ 定位交汇点（junction）</text>
    <text x="620" y="310" fill="#45536b">PC 读取方向数据 → 回溯路径</text>
  </g>

  <!-- 三阶段 -->
  <rect x="60" y="410" width="860" height="0" rx="0"/>
  <rect x="60" y="412" width="860" height="0" rx="0"/>
  <rect x="60" y="412" width="860" height="52" rx="10" fill="#eef4fa" stroke="#c9d8ea"/>
  <text x="490" y="435" text-anchor="middle" fill="#0e5a8a" font-size="12.5" font-weight="600">三阶段：① 地图写入（BLOCK/START/END/TJL）→ ② 路径导引（搜索至收敛，方向存 SRAM）→ ③ 读回（从交汇点回溯拼路径）</text>
</svg>
