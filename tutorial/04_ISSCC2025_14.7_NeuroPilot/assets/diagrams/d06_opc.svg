<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0e5a8a"/>
    </marker>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="960" height="460" fill="#f6f8fb"/>
  <rect x="20" y="14" width="920" height="46" rx="10" fill="#0f1b2d"/>
  <text x="480" y="43" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">OPC 外扩预充电：预充电信号跟着波前走，只充“即将用到”的 PE</text>

  <!-- 概念 -->
  <rect x="40" y="80" width="880" height="140" rx="12" fill="#fff" stroke="#0e5a8a" stroke-width="2" filter="url(#sh)"/>
  <text x="60" y="108" fill="#0e5a8a" font-size="13.5" font-weight="700">问题：动态逻辑节点的“预充电”与“求值”</text>
  <g font-size="12">
    <text x="60" y="136" fill="#45536b">动态逻辑（dynamic logic）用“预充电 → 求值”两相工作：</text>
    <text x="60" y="160" fill="#45536b">• 预充电：把节点充到高电平（为求值做准备）——<strong>每个周期都要做</strong>；</text>
    <text x="60" y="184" fill="#45536b">• 求值：信号传播、放电——<strong>只有被波前到达的 PE 才需要</strong>；</text>
    <text x="60" y="208" fill="#c25e2e" font-weight="600">传统做法：全阵列同时预充电 → 大量 PE 白充（波前还没到）→ 面积/容量浪费</text>
  </g>

  <!-- OPC 流程 -->
  <text x="250" y="250" text-anchor="middle" fill="#1d8a5f" font-size="15" font-weight="700">OPC（Outspread Pre-Charging）：预充电从 START/END 行外扩</text>
  <rect x="40" y="262" width="880" height="140" rx="12" fill="#fff" stroke="#bfe6d2" stroke-width="2" filter="url(#sh)"/>
  <g font-size="11.5">
    <g transform="translate(70,278)">
      <g stroke="#1d8a5f" stroke-width="0.8">
        <rect x="0" y="0" width="34" height="26" fill="#eefaf3"/><rect x="36" y="0" width="34" height="26" fill="#eefaf3"/><rect x="72" y="0" width="34" height="26" fill="#eefaf3"/><rect x="108" y="0" width="34" height="26" fill="#eefaf3"/>
        <rect x="0" y="28" width="34" height="26" fill="#eefaf3"/><rect x="36" y="28" width="34" height="26" fill="#eefaf3"/><rect x="72" y="28" width="34" height="26" fill="#eefaf3"/><rect x="108" y="28" width="34" height="26" fill="#eefaf3"/>
        <rect x="0" y="56" width="34" height="26" fill="#eefaf3"/><rect x="36" y="56" width="34" height="26" fill="#eefaf3"/><rect x="72" y="56" width="34" height="26" fill="#eefaf3"/><rect x="108" y="56" width="34" height="26" fill="#eefaf3"/>
      </g>
      <text x="17" y="18" text-anchor="middle" fill="#c25e2e" font-size="8">START行</text>
      <text x="125" y="80" text-anchor="middle" fill="#c25e2e" font-size="8">END行</text>
    </g>
    <text x="250" y="330" fill="#45536b">预充电信号从 START/END 所在行开始，随波前逐行外扩（上下传播）；</text>
    <text x="250" y="354" fill="#45536b">预充电速度略快于 PE 阵列信号 → 波前到达时节点已就绪；</text>
    <text x="250" y="378" fill="#45536b">两股波前交汇时终止外扩 → <strong>只充“即将用到”的 PE</strong></text>
  </g>

  <!-- 底部 -->
  <rect x="40" y="424" width="880" height="0" rx="0"/>
  <rect x="40" y="424" width="880" height="0" rx="0"/>
  <rect x="40" y="424" width="880" height="30" rx="8" fill="#eefaf3" stroke="#bfe6d2"/>
  <text x="480" y="444" text-anchor="middle" fill="#1d8a5f" font-size="12.5" font-weight="600">→ 保持时间 −1.49×、动态逻辑容量 −1.35×、面积 −1.32×（漏电也更小）</text>
</svg>
