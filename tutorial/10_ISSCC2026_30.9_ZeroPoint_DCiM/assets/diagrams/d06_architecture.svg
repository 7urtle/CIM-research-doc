<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0e5a8a"/>
    </marker>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="1000" height="600" fill="#f6f8fb"/>
  <rect x="20" y="14" width="960" height="46" rx="10" fill="#0f1b2d"/>
  <text x="500" y="43" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">DCiM 加速器整体架构（128 输入通道 × 32 输出通道 × 2 组权重）</text>

  <!-- 输入与 Stage1 -->
  <rect x="30" y="86" width="200" height="70" rx="10" fill="#fff" stroke="#0e5a8a" stroke-width="2" filter="url(#sh)"/>
  <text x="130" y="112" text-anchor="middle" fill="#1a2332" font-size="13.5" font-weight="700">128 个激活输入</text>
  <text x="130" y="134" text-anchor="middle" fill="#6b7a93" font-size="12">8b 无符号/有符号（零点量化）</text>
  <path d="M230,121 H280" stroke="#0e5a8a" stroke-width="2.4" marker-end="url(#ar)"/>
  <rect x="285" y="86" width="230" height="70" rx="10" fill="#eef7fd" stroke="#0e5a8a" stroke-width="2" filter="url(#sh)"/>
  <text x="400" y="110" text-anchor="middle" fill="#0e5a8a" font-size="13.5" font-weight="700">流水线第 1 级：转换单元 ×128</text>
  <text x="400" y="132" text-anchor="middle" fill="#45536b" font-size="12">无符号→有符号（MSB 条件取反）</text>
  <text x="400" y="149" text-anchor="middle" fill="#45536b" font-size="12">+ 合并零点偏置 → 8b 有符号激活</text>
  <path d="M515,121 H565" stroke="#0e5a8a" stroke-width="2.4" marker-end="url(#ar)"/>
  <text x="540" y="78" text-anchor="middle" fill="#0e5a8a" font-size="11.5">广播总线：128 × 8b 有符号激活</text>
  <line x1="565" y1="121" x2="565" y2="330" stroke="#0e5a8a" stroke-width="2"/>
  <line x1="565" y1="330" x2="900" y2="330" stroke="#0e5a8a" stroke-width="2"/>
  <line x1="570" y1="330" x2="570" y2="360" stroke="#0e5a8a" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="680" y1="330" x2="680" y2="360" stroke="#0e5a8a" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="790" y1="330" x2="790" y2="360" stroke="#0e5a8a" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 计算列 1 -->
  <rect x="555" y="366" width="150" height="196" rx="10" fill="#fff" stroke="#1d8a5f" stroke-width="2" filter="url(#sh)"/>
  <text x="630" y="390" text-anchor="middle" fill="#1d8a5f" font-size="12.5" font-weight="700">计算列 0</text>
  <text x="630" y="408" text-anchor="middle" fill="#6b7a93" font-size="10.5">（输出通道 0）</text>
  <rect x="565" y="416" width="130" height="58" rx="6" fill="#eefaf3" stroke="#bfe6d2"/>
  <text x="630" y="434" text-anchor="middle" fill="#1a2332" font-size="10.5">权重存储 ×2 组</text>
  <text x="630" y="450" text-anchor="middle" fill="#6b7a93" font-size="9.5">12T 锁存</text>
  <text x="630" y="464" text-anchor="middle" fill="#6b7a93" font-size="9.5">128 权重/组 + S 位</text>
  <rect x="565" y="480" width="130" height="30" rx="6" fill="#f5f0fc" stroke="#dcccf0"/>
  <text x="630" y="499" text-anchor="middle" fill="#1a2332" font-size="10.5">4 个 bank：32 路 MAC</text>
  <rect x="565" y="516" width="130" height="36" rx="6" fill="#fdf3e7" stroke="#e0a96a"/>
  <text x="630" y="533" text-anchor="middle" fill="#1a2332" font-size="10">第 4 级：bank 求和</text>
  <text x="630" y="547" text-anchor="middle" fill="#1a2332" font-size="10">+ 零点修正项</text>

  <!-- 计算列 2 -->
  <rect x="725" y="366" width="120" height="196" rx="10" fill="#fff" stroke="#1d8a5f" stroke-width="2" filter="url(#sh)"/>
  <text x="785" y="390" text-anchor="middle" fill="#1d8a5f" font-size="12.5" font-weight="700">列 1</text>
  <rect x="733" y="416" width="104" height="58" rx="6" fill="#eefaf3" stroke="#bfe6d2"/>
  <text x="785" y="434" text-anchor="middle" fill="#1a2332" font-size="10.5">权重 ×2 组</text>
  <text x="785" y="450" text-anchor="middle" fill="#6b7a93" font-size="9.5">12T 锁存</text>
  <text x="785" y="464" text-anchor="middle" fill="#6b7a93" font-size="9.5">128/组</text>
  <rect x="733" y="480" width="104" height="30" rx="6" fill="#f5f0fc" stroke="#dcccf0"/>
  <text x="785" y="499" text-anchor="middle" fill="#1a2332" font-size="10.5">4 bank MAC</text>
  <rect x="733" y="516" width="104" height="36" rx="6" fill="#fdf3e7" stroke="#e0a96a"/>
  <text x="785" y="533" text-anchor="middle" fill="#1a2332" font-size="10">第4级+修正</text>
  <text x="785" y="547" text-anchor="middle" fill="#1a2332" font-size="10">输出 1</text>

  <!-- 省略 -->
  <text x="862" y="460" text-anchor="middle" fill="#9aa8bd" font-size="15">……</text>
  <text x="862" y="490" text-anchor="middle" fill="#9aa8bd" font-size="12">共 32 列</text>

  <!-- 计算列 31 -->
  <rect x="880" y="366" width="100" height="196" rx="10" fill="#fff" stroke="#1d8a5f" stroke-width="2" filter="url(#sh)"/>
  <text x="930" y="390" text-anchor="middle" fill="#1d8a5f" font-size="12.5" font-weight="700">列 31</text>
  <rect x="888" y="416" width="84" height="58" rx="6" fill="#eefaf3" stroke="#bfe6d2"/>
  <text x="930" y="434" text-anchor="middle" fill="#1a2332" font-size="10.5">权重 ×2 组</text>
  <text x="930" y="464" text-anchor="middle" fill="#6b7a93" font-size="9.5">12T 锁存</text>
  <rect x="888" y="480" width="84" height="30" rx="6" fill="#f5f0fc" stroke="#dcccf0"/>
  <text x="930" y="499" text-anchor="middle" fill="#1a2332" font-size="10.5">4 bank</text>
  <rect x="888" y="516" width="84" height="36" rx="6" fill="#fdf3e7" stroke="#e0a96a"/>
  <text x="930" y="533" text-anchor="middle" fill="#1a2332" font-size="10">第4级</text>
  <text x="930" y="547" text-anchor="middle" fill="#1a2332" font-size="10">输出 31</text>

  <!-- 输出 -->
  <rect x="30" y="420" width="200" height="70" rx="10" fill="#fff" stroke="#0e5a8a" stroke-width="2" filter="url(#sh)"/>
  <text x="130" y="446" text-anchor="middle" fill="#1a2332" font-size="13.5" font-weight="700">32 个输出通道</text>
  <text x="130" y="468" text-anchor="middle" fill="#6b7a93" font-size="12">每列每周期 1 个</text>
  <text x="130" y="484" text-anchor="middle" fill="#6b7a93" font-size="12">128 路点积结果</text>

  <path d="M555,512 H330" stroke="#0e5a8a" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#ar)"/>
  <path d="M725,512 H330" stroke="#0e5a8a" stroke-width="2" stroke-dasharray="5,4"/>
  <path d="M880,512 H330" stroke="#0e5a8a" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="330" y="505" text-anchor="middle" fill="#6b7a93" font-size="10.5" transform="rotate(-90 330 505)">输出总线 →</text>

  <!-- 底部统计 -->
  <rect x="30" y="530" width="950" height="52" rx="10" fill="#eef4fa" stroke="#c9d8ea"/>
  <text x="505" y="554" text-anchor="middle" fill="#0e5a8a" font-size="12.5" font-weight="600">每周期 MAC 数 = 32 列 × 128 路 = 4096 个 MAC = 8192 次运算</text>
  <text x="505" y="573" text-anchor="middle" fill="#45536b" font-size="12">@2.62 GHz → 21.5 TOPS；占 0.0856 mm² → 250 TOPS/mm²</text>
</svg>
