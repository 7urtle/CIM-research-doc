<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="960" height="500" fill="#f6f8fb"/>
  <rect x="20" y="14" width="920" height="50" rx="10" fill="#0f1b2d"/>
  <text x="480" y="45" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">对称量化 vs 零点（非对称）量化：8bit 整数能表示的范围</text>

  <!-- 左侧：对称 -->
  <text x="250" y="94" text-anchor="middle" fill="#c25e2e" font-size="15" font-weight="700">对称量化（Symmetric）：只用一个尺度 s</text>
  <rect x="40" y="110" width="420" height="220" rx="12" fill="#fff" stroke="#e0a96a" stroke-width="2" filter="url(#sh)"/>
  <!-- 数轴 -->
  <line x1="70" y1="160" x2="430" y2="160" stroke="#45536b" stroke-width="2"/>
  <polygon points="430,155 440,160 430,165" fill="#45536b"/>
  <text x="60" y="148" fill="#1a2332" font-size="12.5" font-weight="600">真实值域 r</text>
  <text x="80" y="186" fill="#c25e2e" font-size="12.5">-127.5</text>
  <text x="215" y="186" fill="#c25e2e" font-size="12.5">0</text>
  <text x="385" y="186" fill="#c25e2e" font-size="12.5">+127.5</text>
  <line x1="250" y1="152" x2="250" y2="168" stroke="#45536b" stroke-width="1.4"/>
  <circle cx="110" cy="160" r="4" fill="#c25e2e"/>
  <circle cx="250" cy="160" r="4" fill="#c25e2e"/>
  <circle cx="390" cy="160" r="4" fill="#c25e2e"/>
  <!-- 整数 -->
  <line x1="70" y1="230" x2="430" y2="230" stroke="#0e5a8a" stroke-width="2"/>
  <polygon points="430,225 440,230 430,235" fill="#0e5a8a"/>
  <text x="60" y="218" fill="#1a2332" font-size="12.5" font-weight="600">量化值 q</text>
  <text x="80" y="256" fill="#0e5a8a" font-size="12.5">-128</text>
  <text x="242" y="256" fill="#0e5a8a" font-size="12.5">0</text>
  <text x="375" y="256" fill="#0e5a8a" font-size="12.5">+127</text>
  <circle cx="110" cy="230" r="4" fill="#0e5a8a"/>
  <circle cx="250" cy="230" r="4" fill="#0e5a8a"/>
  <circle cx="390" cy="230" r="4" fill="#0e5a8a"/>
  <!-- 连线 -->
  <path d="M110,168 C110,196 110,204 110,222" stroke="#9aa8bd" stroke-width="1.4" fill="none" stroke-dasharray="4,3"/>
  <path d="M390,168 C390,196 390,204 390,222" stroke="#9aa8bd" stroke-width="1.4" fill="none" stroke-dasharray="4,3"/>
  <text x="60" y="288" fill="#45536b" font-size="12.5">公式：r = s · q（q ∈ [-128, 127]，s = 极值/127）</text>
  <text x="60" y="312" fill="#c25e2e" font-size="12.5" font-weight="600">问题：</text>
  <text x="60" y="332" fill="#45536b" font-size="12">如果数据是偏态的（例如激活值都 &gt; 0），</text>
  <text x="60" y="352" fill="#45536b" font-size="12">一半的整数区间（负数）被浪费 → 分辨率降低！</text>

  <!-- 右侧：非对称 -->
  <text x="710" y="94" text-anchor="middle" fill="#1d8a5f" font-size="15" font-weight="700">零点量化（Asymmetric）：s 之外再加一个零点 z</text>
  <rect x="500" y="110" width="420" height="220" rx="12" fill="#fff" stroke="#1d8a5f" stroke-width="2" filter="url(#sh)"/>
  <line x1="530" y1="160" x2="890" y2="160" stroke="#45536b" stroke-width="2"/>
  <polygon points="890,155 900,160 890,165" fill="#45536b"/>
  <text x="520" y="148" fill="#1a2332" font-size="12.5" font-weight="600">真实值域 r</text>
  <text x="545" y="186" fill="#1d8a5f" font-size="12.5">-0.2</text>
  <text x="690" y="186" fill="#1d8a5f" font-size="12.5">0</text>
  <text x="860" y="186" fill="#1d8a5f" font-size="12.5">+6.0</text>
  <line x1="705" y1="152" x2="705" y2="168" stroke="#45536b" stroke-width="1.4"/>
  <circle cx="560" cy="160" r="4" fill="#1d8a5f"/>
  <circle cx="705" cy="160" r="4" fill="#1d8a5f"/>
  <circle cx="880" cy="160" r="4" fill="#1d8a5f"/>
  <line x1="530" y1="230" x2="890" y2="230" stroke="#0e5a8a" stroke-width="2"/>
  <polygon points="890,225 900,230 890,235" fill="#0e5a8a"/>
  <text x="520" y="218" fill="#1a2332" font-size="12.5" font-weight="600">量化值 q</text>
  <text x="548" y="256" fill="#0e5a8a" font-size="12.5">0</text>
  <text x="695" y="256" fill="#0e5a8a" font-size="12.5">z=58</text>
  <text x="862" y="256" fill="#0e5a8a" font-size="12.5">255</text>
  <circle cx="560" cy="230" r="4" fill="#0e5a8a"/>
  <circle cx="705" cy="230" r="4" fill="#0e5a8a"/>
  <circle cx="880" cy="230" r="4" fill="#0e5a8a"/>
  <path d="M560,168 C560,196 560,204 560,222" stroke="#9aa8bd" stroke-width="1.4" fill="none" stroke-dasharray="4,3"/>
  <path d="M880,168 C880,196 880,204 880,222" stroke="#9aa8bd" stroke-width="1.4" fill="none" stroke-dasharray="4,3"/>
  <text x="520" y="288" fill="#45536b" font-size="12.5">公式：r = s · (q − z)，q ∈ [0, 255]（无符号）</text>
  <text x="520" y="312" fill="#1d8a5f" font-size="12.5" font-weight="600">好处：</text>
  <text x="520" y="332" fill="#45536b" font-size="12">零点 z 可以落在任意位置 → 把全部 256 个整数</text>
  <text x="520" y="352" fill="#45536b" font-size="12">都用来表示实际数据范围 → 分辨率更高、精度更好</text>

  <rect x="20" y="346" width="920" height="90" rx="10" fill="#eef4fa" stroke="#c9d8ea"/>
  <text x="480" y="374" text-anchor="middle" fill="#0e5a8a" font-size="13.5" font-weight="700">为什么量化对硬件这么重要？</text>
  <text x="480" y="400" text-anchor="middle" fill="#45536b" font-size="12.5">INT8 乘法器的面积/功耗大约是 FP32 的 1/10 甚至更低，访存量也减半；</text>
  <text x="480" y="420" text-anchor="middle" fill="#45536b" font-size="12.5">而“零点量化”在几乎不损失精度的前提下，让 8bit 就能覆盖偏态分布的数据（如 ReLU 后的激活值）</text>
</svg>
