<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="960" height="560" fill="#f6f8fb"/>
  <rect x="20" y="14" width="920" height="50" rx="10" fill="#0f1b2d"/>
  <text x="480" y="45" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">轻量片上微调核心 ODFC（论文 Fig.13–15）</text>

  <!-- motivation -->
  <rect x="40" y="84" width="880" height="110" rx="12" fill="#fff" stroke="#e66e5a" stroke-width="2" filter="url(#sh)"/>
  <text x="60" y="110" fill="#e66e5a" font-size="13.5" font-weight="700">为什么需要 ODFC？</text>
  <g font-size="12.5">
    <text x="60" y="140" fill="#45536b">边缘环境变化（光照/天气）→ 测试样本与训练集偏差 → MNIST 训练 99.1% 精度、MNIST-M 测试暴跌到 13.8%</text>
    <text x="60" y="166" fill="#45536b">先前 FP-CIM 不支持片上微调 → 需要「训练硬件」——但训练比推理复杂得多、面积受限</text>
  </g>

  <!-- dataflow -->
  <rect x="40" y="214" width="430" height="200" rx="12" fill="#fff" stroke="#1d8a5f" stroke-width="2" filter="url(#sh)"/>
  <text x="60" y="240" fill="#1d8a5f" font-size="13.5" font-weight="700">多轮数据流（128 轮顺序更新）</text>
  <g font-size="11.5">
    <text x="60" y="268" fill="#45536b">每轮只更新 16 个权重（128×16 全部更新需 128 轮）</text>
    <text x="60" y="290" fill="#45536b">每轮四相：</text>
    <g>
      <rect x="70" y="300" width="80" height="28" rx="5" fill="#d9f0e4" stroke="#1d8a5f"/><text x="110" y="319" text-anchor="middle" fill="#1d8a5f" font-size="10">权重读</text>
      <rect x="158" y="300" width="80" height="28" rx="5" fill="#d9f0e4" stroke="#1d8a5f"/><text x="198" y="319" text-anchor="middle" fill="#1d8a5f" font-size="10">权重更新</text>
      <rect x="246" y="300" width="80" height="28" rx="5" fill="#fdeeda" stroke="#f0a030"/><text x="286" y="319" text-anchor="middle" fill="#a06510" font-size="10">梯度计算</text>
      <rect x="334" y="300" width="80" height="28" rx="5" fill="#d9f0e4" stroke="#1d8a5f"/><text x="374" y="319" text-anchor="middle" fill="#1d8a5f" font-size="10">权重写</text>
    </g>
    <text x="60" y="354" fill="#45536b">16 权重读出归一化 → k 周期 ODFC 计算（k=梯度向量长）</text>
    <text x="60" y="376" fill="#45536b">每周期 1×16 梯度 → 更新前层权重 → 写回 CIM</text>
    <text x="60" y="398" fill="#1d8a5f" font-weight="600">只更新 16 个/轮 → 电路面积大幅降低</text>
  </g>

  <!-- hardware -->
  <rect x="490" y="214" width="430" height="200" rx="12" fill="#fff" stroke="#6b3fa0" stroke-width="2" filter="url(#sh)"/>
  <text x="510" y="240" fill="#6b3fa0" font-size="13.5" font-weight="700">硬件优化</text>
  <g font-size="11.5">
    <text x="510" y="268" fill="#45536b">时分复用 BF16 乘法器/加法树</text>
    <text x="510" y="290" fill="#45536b">（不同计算阶段共享硬件）→ 面积再省 10%</text>
    <text x="510" y="318" fill="#45536b">多 FP 数累加有对齐损失：大数加小数时</text>
    <text x="510" y="340" fill="#45536b">小数移位后尾数变 0 → 三个数之和 = 0（Fig.15a）</text>
    <text x="510" y="368" fill="#1d8a5f" font-weight="600">保损失 FP 加法：对齐误差保留、下一级再加</text>
    <text x="510" y="390" fill="#45536b">应用于 16×BF16 加法树 → 降低多级求和损失</text>
  </g>

  <!-- results -->
  <rect x="40" y="434" width="880" height="100" rx="12" fill="#eef4fa" stroke="#c9d8ea"/>
  <text x="60" y="460" fill="#0e5a8a" font-size="14" font-weight="700">ODFC 实测</text>
  <g font-size="12.5">
    <text x="60" y="488" fill="#45536b">0.037 mm² · 180 MHz（与 CIM core 同频）· 16 ops/周期 · 2.88 GOPS @BF16（0.9V）</text>
    <text x="60" y="512" fill="#45536b">面积效率 0.078 TFLOPS/mm² · 能效 1.71 TFLOPS/W（post-layout）· 6 层模型微调总延迟 14.3ms、能耗 18.1µJ</text>
  </g>
</svg>
