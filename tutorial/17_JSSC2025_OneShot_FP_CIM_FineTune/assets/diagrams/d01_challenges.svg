<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="960" height="560" fill="#f6f8fb"/>
  <rect x="20" y="14" width="920" height="50" rx="10" fill="#0f1b2d"/>
  <text x="480" y="45" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">预对齐 FP-CIM 的四步流程与三大挑战（论文 Fig.1/2）</text>

  <!-- 4 steps -->
  <rect x="40" y="84" width="880" height="150" rx="12" fill="#fff" stroke="#1d8a5f" stroke-width="2" filter="url(#sh)"/>
  <text x="60" y="110" fill="#1d8a5f" font-size="13.5" font-weight="700">预对齐 FP-CIM 的典型四步（BF16 例）</text>
  <g font-size="12">
    <rect x="60" y="130" width="190" height="56" rx="8" fill="#d9f0e4" stroke="#1d8a5f"/>
    <text x="155" y="150" text-anchor="middle" fill="#1d8a5f" font-weight="600">① XE_max 选择</text>
    <text x="155" y="170" text-anchor="middle" fill="#45536b" font-size="10.5">多级比较器找最大指数（1 周期）</text>
    <rect x="270" y="130" width="190" height="56" rx="8" fill="#d9f0e4" stroke="#1d8a5f"/>
    <text x="365" y="150" text-anchor="middle" fill="#1d8a5f" font-weight="600">② 输入对齐</text>
    <text x="365" y="170" text-anchor="middle" fill="#45536b" font-size="10.5">尾数移位对齐到 XE_max（1 周期）</text>
    <rect x="480" y="130" width="190" height="56" rx="8" fill="#fdeeda" stroke="#f0a030"/>
    <text x="575" y="150" text-anchor="middle" fill="#a06510" font-weight="600">③ 尾数 MAC</text>
    <text x="575" y="170" text-anchor="middle" fill="#45536b" font-size="10.5">INT8 位串行 → 8 周期！</text>
    <rect x="690" y="130" width="190" height="56" rx="8" fill="#d9f0e4" stroke="#1d8a5f"/>
    <text x="785" y="150" text-anchor="middle" fill="#1d8a5f" font-weight="600">④ INT→FP 转换</text>
    <text x="785" y="170" text-anchor="middle" fill="#45536b" font-size="10.5">找最高位 1 并移位（1 周期）</text>
    <text x="60" y="218" fill="#45536b">步骤①②④各 1 周期，但③要 8 周期 → 前三个电路 87.5% 时间闲置 → 利用率/吞吐低</text>
  </g>

  <!-- challenges -->
  <rect x="40" y="254" width="880" height="280" rx="12" fill="#eef4fa" stroke="#c9d8ea"/>
  <text x="60" y="280" fill="#0e5a8a" font-size="14" font-weight="700">三大挑战</text>
  <g font-size="12.5">
    <text x="60" y="312" fill="#e66e5a" font-weight="600">挑战① INT 尾数 MAC 拖慢吞吐</text>
    <text x="80" y="334" fill="#45536b">位串行 8 周期（Booth 编码 4 周期但仍需编解码电路）；位并行则乘法器+加法树占 96% 面积/能耗</text>
    <text x="60" y="366" fill="#f0a030" font-weight="600">挑战② FP/INT 转换开销大</text>
    <text x="80" y="388" fill="#45536b">步骤①需 127 个 8 位比较器（128 输入）；步骤④要搜 16 位整数找最高位 1 → 组合逻辑延迟和面积大</text>
    <text x="60" y="420" fill="#6b3fa0" font-weight="600">挑战③ 环境变化掉精度</text>
    <text x="80" y="442" fill="#45536b">边缘设备光照/天气变化 → 测试样本与训练集差异 → 精度大跌（MNIST 99.1% → MNIST-M 13.8%）</text>
    <text x="60" y="480" fill="#1d8a5f" font-weight="600">本论文三招：</text>
    <text x="80" y="506" fill="#1d8a5f" font-weight="600">① one-shot 计算（multiply-less → 最小选择，1 周期完成）· ② 输入-权重协同对齐（免 XE_max 选择 + UBF16）· ③ ODFC 片上微调</text>
  </g>
</svg>
