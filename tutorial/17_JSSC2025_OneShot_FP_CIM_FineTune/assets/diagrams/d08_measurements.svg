<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="960" height="560" fill="#f6f8fb"/>
  <rect x="20" y="14" width="920" height="50" rx="10" fill="#0f1b2d"/>
  <text x="480" y="45" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">芯片实测：128 TFLOPS/W · 7.02 TFLOPS/mm²（论文 Fig.16–19）</text>

  <!-- spec -->
  <rect x="40" y="84" width="430" height="230" rx="12" fill="#fff" stroke="#1d8a5f" stroke-width="2" filter="url(#sh)"/>
  <text x="60" y="110" fill="#1d8a5f" font-size="14" font-weight="700">芯片规格</text>
  <g font-size="12">
    <text x="60" y="138" fill="#45536b">工艺 28nm CMOS · 面积 1.7×1.1 mm²</text>
    <text x="60" y="162" fill="#45536b">CIM core 0.084 · ManAU 0.018 · ITFU 0.003 · ODFC 0.037 mm²</text>
    <text x="60" y="186" fill="#45536b">电压 0.55–0.9 V · 频率 20–180 MHz</text>
    <text x="60" y="210" fill="#45536b">SRAM 读写只在 0.9 V；低电压计算时 SRAM 静态保持 → 宽电压范围</text>
    <text x="60" y="234" fill="#45536b">峰值性能 737 GOPS @0.9V/180MHz（UBF16）</text>
    <text x="60" y="258" fill="#1d8a5f" font-weight="600">峰值能效 128 TFLOPS/W @0.55V/20MHz</text>
    <text x="60" y="282" fill="#45536b">（10% 输入稀疏 + 50% 权重稀疏）</text>
    <text x="60" y="306" fill="#1d8a5f" font-weight="600">峰值面积效率 7.02 TFLOPS/mm² @0.9V/180MHz</text>
  </g>

  <!-- breakdown -->
  <rect x="490" y="84" width="430" height="230" rx="12" fill="#fff" stroke="#f0a030" stroke-width="2" filter="url(#sh)"/>
  <text x="510" y="110" fill="#d08a10" font-size="14" font-weight="700">面积/能耗分解（Fig.19a）</text>
  <g font-size="11.5">
    <text x="510" y="138" fill="#45536b">ManAU + ITFU（FP/INT 转换）</text>
    <text x="510" y="160" fill="#1d8a5f" font-weight="600">面积仅 18.1% · 能耗仅 11.4%</text>
    <text x="510" y="188" fill="#45536b">单列布局（Fig.19b）：SRAM、WSUM、ParMS、ACC-ASU</text>
    <text x="510" y="212" fill="#45536b">数字逻辑（ParMS+ACC-ASU）只有 SRAM 的 5.2×</text>
    <text x="510" y="236" fill="#45536b">（并行乘法 FP-CIM [22] 中乘法器+加法树是 SRAM 的 49×）</text>
    <text x="510" y="266" fill="#1d8a5f" font-weight="600">→ one-shot + ParMS 把数字逻辑压薄 9.4×</text>
    <text x="510" y="296" fill="#45536b">FoM（精度×面积效率×能效）vs [14] 基线：+5×</text>
  </g>

  <!-- comparison -->
  <rect x="40" y="334" width="880" height="200" rx="12" fill="#eef4fa" stroke="#c9d8ea"/>
  <text x="60" y="360" fill="#0e5a8a" font-size="14" font-weight="700">与 SOTA 对比（表 V）</text>
  <g font-size="12.5">
    <text x="60" y="390" fill="#45536b">同工艺下面积/能效最高：</text>
    <text x="80" y="416" fill="#1d8a5f" font-weight="600">vs 最新 FP-CIM [21]：能效 +4.1× · 面积效率 +3.6× · FoM +14.7×</text>
    <text x="80" y="442" fill="#45536b">（BF16 口径；摘要口径面积效率 +3.4×，正文 +3.6×）</text>
    <text x="60" y="470" fill="#45536b">vs 位并行乘法 FP-CIM [22]：one-shot 大幅降低数字逻辑面积/能耗</text>
    <text x="60" y="498" fill="#45536b">vs 仅推理 FP-CIM：ODFC 支持在线更新 → 环境变化时保持高精度（差异化优势）</text>
  </g>
</svg>
