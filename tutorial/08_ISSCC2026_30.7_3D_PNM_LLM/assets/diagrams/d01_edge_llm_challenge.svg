<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="960" height="480" fill="#f6f8fb"/>
  <rect x="20" y="14" width="920" height="50" rx="10" fill="#0f1b2d"/>
  <text x="480" y="45" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">边缘 LLM 推理的困境：为什么“生成式 AI 上终端”这么难</text>

  <!-- 三个挑战 -->
  <g>
    <rect x="40" y="90" width="280" height="170" rx="12" fill="#fff" stroke="#c25e2e" stroke-width="2" filter="url(#sh)"/>
    <text x="180" y="118" text-anchor="middle" fill="#c25e2e" font-size="14" font-weight="700">挑战 1：小批量 → 内存密集</text>
    <text x="60" y="148" fill="#45536b" font-size="12">云端推理用大批量（batch）复用数据；</text>
    <text x="60" y="170" fill="#45536b" font-size="12">终端 LLM 一次只服务 1 个用户（batch=1），</text>
    <text x="60" y="192" fill="#45536b" font-size="12">生成阶段每个 token 只依赖前文权重，</text>
    <text x="60" y="214" fill="#c25e2e" font-size="12" font-weight="600">数据复用极低 → 系统变成“内存带宽受限”</text>
    <text x="60" y="240" fill="#45536b" font-size="12">（memory-intensive）</text>

    <rect x="340" y="90" width="280" height="170" rx="12" fill="#fff" stroke="#0e5a8a" stroke-width="2" filter="url(#sh)"/>
    <text x="480" y="118" text-anchor="middle" fill="#0e5a8a" font-size="14" font-weight="700">挑战 2：CPU / GPU 各有短板</text>
    <text x="360" y="148" fill="#45536b" font-size="12">• CPU（PC）：算力不足，跑不动大模型</text>
    <text x="360" y="172" fill="#45536b" font-size="12">• GPU（独立显卡）：算力够，但</text>
    <text x="360" y="194" fill="#45536b" font-size="12">　内存带宽受限 + 功耗太高，</text>
    <text x="360" y="216" fill="#0e5a8a" font-size="12" font-weight="600">电池供电的手机根本扛不住</text>
    <text x="360" y="240" fill="#45536b" font-size="12">（GPU 功耗是“瓦特级~百瓦级”）</text>

    <rect x="640" y="90" width="280" height="170" rx="12" fill="#fff" stroke="#6b3fa0" stroke-width="2" filter="url(#sh)"/>
    <text x="780" y="118" text-anchor="middle" fill="#6b3fa0" font-size="14" font-weight="700">挑战 3：片上放不下 LLM</text>
    <text x="660" y="148" fill="#45536b" font-size="12">LLM 权重动辄 GB 级（7B 模型 ≈ 14 GB FP16），</text>
    <text x="660" y="172" fill="#45536b" font-size="12">片上 SRAM/逻辑芯片完全放不下，</text>
    <text x="660" y="194" fill="#45536b" font-size="12">必须从外部 DRAM 反复取权重 ——</text>
    <text x="660" y="216" fill="#6b3fa0" font-size="12" font-weight="600">“访存瓶颈”（memory wall）成为主角</text>
    <text x="660" y="240" fill="#45536b" font-size="12">（LLM 推理 ≈ 搬运权重）</text>
  </g>

  <!-- 需求 -->
  <rect x="40" y="286" width="880" height="86" rx="10" fill="#eef7fd" stroke="#b8d9ee"/>
  <text x="60" y="314" fill="#0e5a8a" font-size="13.5" font-weight="700">终端 LLM 需要的硬件画像（论文的“需求清单”）</text>
  <text x="60" y="340" fill="#45536b" font-size="12.5">① 足够的算力（推理 GEMM）　② 足够的内存带宽（喂得饱权重）</text>
  <text x="60" y="360" fill="#45536b" font-size="12.5">③ 高能效（电池供电）　④ 易集成（接进现有 PC/手机平台）</text>

  <rect x="40" y="388" width="880" height="70" rx="10" fill="#eefaf3" stroke="#bfe6d2"/>
  <text x="480" y="416" text-anchor="middle" fill="#1d8a5f" font-size="13.5" font-weight="600">本论文的回答：把“GB 级 DRAM”和“1.2GHz 标准逻辑”用 3D 堆叠叠在一起</text>
  <text x="480" y="440" text-anchor="middle" fill="#45536b" font-size="12.5">→ 近存计算（PNM）：算力靠近权重，访存延迟与能耗大幅下降，还兼容 DDR4 接口</text>
</svg>
