<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0e5a8a"/>
    </marker>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="960" height="540" fill="#f6f8fb"/>
  <rect x="20" y="14" width="920" height="46" rx="10" fill="#0f1b2d"/>
  <text x="480" y="43" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">3D NMC 芯片整体架构：8 个 BG 块 ×（2×512Mb DRAM + 计算模块）</text>

  <!-- 顶部：主机接口 -->
  <rect x="60" y="80" width="300" height="56" rx="10" fill="#fff" stroke="#6b3fa0" stroke-width="2" filter="url(#sh)"/>
  <text x="210" y="104" text-anchor="middle" fill="#6b3fa0" font-size="13" font-weight="600">系统主机（CPU 等）</text>
  <text x="210" y="124" text-anchor="middle" fill="#45536b" font-size="11">DDR4 兼容接口 · T-ACC / Act-Reg 扩展命令</text>
  <path d="M360,108 H420" stroke="#6b3fa0" stroke-width="2.4" marker-end="url(#ar)"/>
  <rect x="420" y="80" width="200" height="56" rx="10" fill="#fff" stroke="#6b3fa0" stroke-width="2" filter="url(#sh)"/>
  <text x="520" y="104" text-anchor="middle" fill="#6b3fa0" font-size="13" font-weight="600">DDR 接口 + 解码器</text>
  <text x="520" y="124" text-anchor="middle" fill="#45536b" font-size="11">解析命令 → 控制目标模块</text>
  <path d="M620,108 H700" stroke="#6b3fa0" stroke-width="2.4" marker-end="url(#ar)"/>
  <text x="660" y="70" text-anchor="middle" fill="#45536b" font-size="11">广播到 8 个 BG</text>

  <!-- 8 个 BG -->
  <rect x="60" y="160" width="880" height="250" rx="12" fill="#fff" stroke="#0e5a8a" stroke-width="2" filter="url(#sh)"/>
  <text x="80" y="188" fill="#0e5a8a" font-size="13.5" font-weight="700">8 × BG（BankGroup）块 —— 每个 BG = 1Gb</text>
  <g font-size="10.5">
    <rect x="80" y="200" width="200" height="150" rx="10" fill="#eef7fd" stroke="#0e5a8a" stroke-width="1.6"/>
    <text x="180" y="222" text-anchor="middle" fill="#0e5a8a" font-weight="600">BG0</text>
    <rect x="94" y="234" width="80" height="30" rx="5" fill="#eefaf3" stroke="#bfe6d2"/><text x="134" y="253" text-anchor="middle" fill="#1d8a5f">DRAM_N 512Mb</text>
    <rect x="186" y="234" width="80" height="30" rx="5" fill="#eefaf3" stroke="#bfe6d2"/><text x="226" y="253" text-anchor="middle" fill="#1d8a5f">DRAM_F 512Mb</text>
    <rect x="94" y="276" width="172" height="30" rx="5" fill="#fdf3e7" stroke="#e0a96a"/><text x="180" y="295" text-anchor="middle" fill="#c25e2e">计算模块（2×ACC）</text>
    <text x="94" y="328" fill="#45536b">2048b RDL 总线 ↓</text>
    <rect x="300" y="200" width="150" height="150" rx="10" fill="#eef7fd" stroke="#0e5a8a" stroke-width="1.6"/>
    <text x="375" y="222" text-anchor="middle" fill="#0e5a8a" font-weight="600">BG1</text>
    <text x="375" y="300" text-anchor="middle" fill="#45536b">同上结构</text>
    <rect x="470" y="200" width="150" height="150" rx="10" fill="#eef7fd" stroke="#0e5a8a" stroke-width="1.6"/>
    <text x="545" y="222" text-anchor="middle" fill="#0e5a8a" font-weight="600">…</text>
    <text x="545" y="300" text-anchor="middle" fill="#45536b">共 8 个</text>
    <rect x="640" y="200" width="280" height="150" rx="10" fill="#eef7fd" stroke="#0e5a8a" stroke-width="1.6"/>
    <text x="780" y="222" text-anchor="middle" fill="#0e5a8a" font-weight="600">BG7</text>
    <rect x="654" y="234" width="120" height="30" rx="5" fill="#eefaf3" stroke="#bfe6d2"/><text x="714" y="253" text-anchor="middle" fill="#1d8a5f">DRAM_N/F</text>
    <rect x="654" y="276" width="252" height="30" rx="5" fill="#fdf3e7" stroke="#e0a96a"/><text x="780" y="295" text-anchor="middle" fill="#c25e2e">计算模块（2×ACC）</text>
  </g>

  <!-- 底部 -->
  <rect x="60" y="430" width="880" height="88" rx="10" fill="#eefaf3" stroke="#bfe6d2"/>
  <text x="80" y="458" fill="#1d8a5f" font-size="13" font-weight="700">关键数字</text>
  <text x="80" y="482" fill="#45536b" font-size="12.5">• 片上总容量：8 BG × 1Gb = <strong>1 GB（8 Gb）</strong>　• 存储密度：<strong>99.4 Mb/mm²</strong></text>
  <text x="80" y="504" fill="#45536b" font-size="12.5">• 每 BG 输出总线：<strong>2048b</strong>（16 段 × 8 段 × 8 组 × 2 die）　• 带宽密度：<strong>12.77 GB/s/mm²</strong></text>
</svg>
