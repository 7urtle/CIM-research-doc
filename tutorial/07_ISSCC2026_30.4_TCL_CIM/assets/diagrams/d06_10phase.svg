<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="960" height="500" fill="#f6f8fb"/>
  <rect x="20" y="14" width="920" height="46" rx="10" fill="#0f1b2d"/>
  <text x="480" y="43" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">10 相发生器：一个周期内，10 个相位依次点亮</text>

  <!-- RDC 级联 -->
  <rect x="40" y="80" width="880" height="150" rx="12" fill="#fff" stroke="#dfe6f0" stroke-width="2" filter="url(#sh)"/>
  <text x="60" y="106" fill="#123a57" font-size="13.5" font-weight="700">10 个相同“上升沿延迟单元（RDC）”级联</text>
  <g font-size="10.5">
    <rect x="70" y="122" width="70" height="40" rx="6" fill="#eef7fd" stroke="#0e5a8a"/>
    <text x="105" y="140" text-anchor="middle" fill="#0e5a8a">RDC#0</text>
    <text x="105" y="156" text-anchor="middle" fill="#45536b">Δtr0</text>
    <rect x="180" y="122" width="70" height="40" rx="6" fill="#eef7fd" stroke="#0e5a8a"/>
    <text x="215" y="140" text-anchor="middle" fill="#0e5a8a">RDC#1</text>
    <text x="215" y="156" text-anchor="middle" fill="#45536b">Δtr1</text>
    <text x="270" y="145" text-anchor="middle" fill="#9aa8bd" font-size="13">……</text>
    <rect x="290" y="122" width="70" height="40" rx="6" fill="#eef7fd" stroke="#0e5a8a"/>
    <text x="325" y="140" text-anchor="middle" fill="#0e5a8a">RDC#9</text>
    <text x="325" y="156" text-anchor="middle" fill="#45536b">Δtr9</text>
    <text x="420" y="142" fill="#45536b">Clk 上升沿时 Vrst 同步拉高再快速拉低：</text>
    <text x="420" y="162" fill="#45536b">Vrst=1 → 所有 Ph0~9 清零；Vrst=0 → Ph0 先亮，</text>
    <text x="420" y="182" fill="#45536b">之后每个 RDC 的延迟把 Ph1、Ph2…Ph9 依次点亮</text>
  </g>

  <!-- 时序图 -->
  <text x="60" y="260" fill="#123a57" font-size="13.5" font-weight="700">一个计算周期内的 10 个相位（Ph0~7 逐位乘法、Ph8 合并加法、Ph9 加法树）</text>
  <g font-size="10">
    <text x="60" y="290" fill="#0e5a8a">Clk</text>
    <polyline points="100,285 130,285 130,275 160,275 160,285 190,285 190,275 220,275 220,285 250,285 250,275 280,275 280,285 310,285 310,275 340,275 340,285 370,285" fill="none" stroke="#0e5a8a" stroke-width="2"/>
    <text x="60" y="320" fill="#c25e2e">Ph0</text>
    <rect x="100" y="310" width="30" height="8" fill="#c25e2e"/>
    <text x="60" y="344" fill="#c25e2e">Ph1</text>
    <rect x="130" y="334" width="30" height="8" fill="#c25e2e"/>
    <text x="60" y="368" fill="#c25e2e">Ph2</text>
    <rect x="160" y="358" width="30" height="8" fill="#c25e2e"/>
    <text x="60" y="392" fill="#9aa8bd">…</text>
    <text x="60" y="416" fill="#6b3fa0">Ph7</text>
    <rect x="370" y="406" width="30" height="8" fill="#6b3fa0"/>
    <text x="60" y="440" fill="#1d8a5f">Ph8 合并加法器</text>
    <rect x="400" y="430" width="60" height="8" fill="#1d8a5f"/>
    <text x="60" y="464" fill="#1d8a5f">Ph9 加法树</text>
    <rect x="460" y="454" width="80" height="8" fill="#1d8a5f"/>
    <text x="560" y="330" fill="#45536b">每个相位恰好使能一个 MMU 列（串行传播边沿）</text>
    <text x="560" y="356" fill="#45536b">Ph8/Ph9 之前，合并加法器和加法树输入被强制接地 → 不空转</text>
    <text x="560" y="382" fill="#6b3fa0" font-weight="600">→ 分阶段使能（stage-wise）省掉无谓翻转 → 能效 +42%</text>
    <text x="560" y="408" fill="#45536b">代价：加法树使能级数增加会加面积（论文选 1 级合并 + 1 级树）</text>
    <text x="560" y="434" fill="#45536b">→ 42% 能效提升只付出 6% 面积效率下降</text>
  </g>
</svg>
