<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="960" height="480" fill="#f6f8fb"/>
  <rect x="20" y="14" width="920" height="46" rx="10" fill="#0f1b2d"/>
  <text x="480" y="43" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">外积与“位列加法”：8b×8b 乘法 = 64 个位积 + 15 个位列求和</text>

  <!-- 外积 -->
  <rect x="40" y="90" width="440" height="240" rx="12" fill="#fff" stroke="#0e5a8a" stroke-width="2" filter="url(#sh)"/>
  <text x="60" y="118" fill="#0e5a8a" font-size="13.5" font-weight="700">外积（Outer Product）：64 个位积</text>
  <g font-size="10.5">
    <rect x="70" y="136" width="100" height="30" rx="5" fill="#eef7fd" stroke="#0e5a8a"/>
    <text x="120" y="156" text-anchor="middle" fill="#0e5a8a">激活 X[7:0]</text>
    <rect x="180" y="136" width="280" height="30" rx="5" fill="#eefaf3" stroke="#1d8a5f"/>
    <text x="320" y="156" text-anchor="middle" fill="#1d8a5f">权重 W[7:0]（按位相乘）</text>
    <g>
      <!-- 8x8 网格 -->
      <g transform="translate(100,190)">
        <line x1="0" y1="0" x2="260" y2="0" stroke="#9aa8bd" stroke-width="1"/>
        <line x1="0" y1="0" x2="0" y2="260" stroke="#9aa8bd" stroke-width="1"/>
        <line x1="260" y1="0" x2="260" y2="260" stroke="#9aa8bd" stroke-width="1"/>
        <line x1="0" y1="260" x2="260" y2="260" stroke="#9aa8bd" stroke-width="1"/>
        <g fill="#cfe6f5" stroke="#0e5a8a" stroke-width="0.8">
          <rect x="2" y="2" width="30" height="30"/><rect x="34" y="2" width="30" height="30"/><rect x="66" y="2" width="30" height="30"/><rect x="98" y="2" width="30" height="30"/>
          <rect x="130" y="2" width="30" height="30"/><rect x="162" y="2" width="30" height="30"/><rect x="194" y="2" width="30" height="30"/><rect x="226" y="2" width="30" height="30"/>
        </g>
        <g fill="#e4f6ec" stroke="#1d8a5f" stroke-width="0.8">
          <rect x="2" y="34" width="30" height="30"/><rect x="34" y="34" width="30" height="30"/><rect x="66" y="34" width="30" height="30"/><rect x="98" y="34" width="30" height="30"/>
          <rect x="130" y="34" width="30" height="30"/><rect x="162" y="34" width="30" height="30"/><rect x="194" y="34" width="30" height="30"/><rect x="226" y="34" width="30" height="30"/>
        </g>
        <g fill="#fdf0e4" stroke="#e0a96a" stroke-width="0.8">
          <rect x="2" y="66" width="30" height="30"/><rect x="34" y="66" width="30" height="30"/><rect x="66" y="66" width="30" height="30"/><rect x="98" y="66" width="30" height="30"/>
          <rect x="130" y="66" width="30" height="30"/><rect x="162" y="66" width="30" height="30"/><rect x="194" y="66" width="30" height="30"/><rect x="226" y="66" width="30" height="30"/>
        </g>
      </g>
    </g>
  </g>
  <text x="60" y="470" fill="#6b7a93" font-size="11">位积 P[m][n] = X[m] × W[n]（m、n = 0~7）</text>

  <!-- 位列 -->
  <rect x="520" y="90" width="400" height="240" rx="12" fill="#fff" stroke="#6b3fa0" stroke-width="2" filter="url(#sh)"/>
  <text x="540" y="118" fill="#6b3fa0" font-size="13.5" font-weight="700">位列求和：15 个 TCL 同时做</text>
  <g font-size="11">
    <text x="540" y="146" fill="#45536b">位积按“对角斜线”分组（同移位位置）</text>
    <text x="540" y="170" fill="#45536b">→ 8b×8b 共 <strong>15 个位列</strong>（TCL-0 … TCL-14）</text>
    <g transform="translate(540,186)">
      <line x1="0" y1="10" x2="280" y2="10" stroke="#6b3fa0" stroke-width="2"/>
      <g font-size="10" fill="#6b3fa0" text-anchor="middle">
        <rect x="-6" y="0" width="14" height="20" fill="#f5f0fc" stroke="#dcccf0"/><text x="1" y="15">0</text>
        <rect x="24" y="0" width="14" height="20" fill="#f5f0fc" stroke="#dcccf0"/><text x="31" y="15">1</text>
        <rect x="54" y="0" width="14" height="20" fill="#f5f0fc" stroke="#dcccf0"/><text x="61" y="15">2</text>
        <rect x="84" y="0" width="14" height="20" fill="#f5f0fc" stroke="#dcccf0"/><text x="91" y="15">3</text>
        <text x="115" y="15">…</text>
        <rect x="124" y="0" width="14" height="20" fill="#fdf3e7" stroke="#e0a96a"/><text x="131" y="15">7</text>
        <text x="155" y="15">…</text>
        <rect x="164" y="0" width="14" height="20" fill="#f5f0fc" stroke="#dcccf0"/><text x="171" y="15">13</text>
        <rect x="194" y="0" width="14" height="20" fill="#eefaf3" stroke="#bfe6d2"/><text x="201" y="15">14</text>
      </g>
    </g>
    <text x="540" y="250" fill="#45536b">每个位列最多 8 个位积（列 0~7 递增，列 7 最宽）</text>
    <text x="540" y="274" fill="#45536b">每位积求和 = 数“这一列有几个 1”</text>
    <text x="540" y="304" fill="#6b3fa0" font-weight="600">→ 15 个位列和 → 合并加法器 → 16b 乘积</text>
    <text x="540" y="330" fill="#6b3fa0" font-weight="600">传统：加法器阵列压缩；本文：TCL 数沿（见下章）</text>
  </g>
</svg>
