<tr><th>挑战</th><th>现有方案及其代价</th><th>本文对策</th></tr>

<tr><td>③ 加法器空转</td><td>加法树全程开闸，毛刺白烧电</td><td><strong>10 相分阶段使能</strong>：Ph8/Ph9 才开加法 → 能效 +42%</td></tr>
