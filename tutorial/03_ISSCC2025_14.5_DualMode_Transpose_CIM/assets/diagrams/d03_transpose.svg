<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="960" height="480" fill="#f6f8fb"/>
  <rect x="20" y="14" width="920" height="46" rx="10" fill="#0f1b2d"/>
  <text x="480" y="43" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">转置的概念：FF 读“行”，BP 读“对角”＝转置</text>

  <!-- 权重矩阵 -->
  <rect x="60" y="90" width="420" height="330" rx="12" fill="#fff" stroke="#1d8a5f" stroke-width="2" filter="url(#sh)"/>
  <text x="270" y="118" text-anchor="middle" fill="#1d8a5f" font-size="13.5" font-weight="700">权重矩阵 W（循环映射存储）</text>
  <g font-size="11">
    <g transform="translate(90,140)">
      <line x1="0" y1="0" x2="260" y2="0" stroke="#9aa8bd" stroke-width="1.2"/>
      <line x1="0" y1="0" x2="0" y2="260" stroke="#9aa8bd" stroke-width="1.2"/>
      <line x1="260" y1="0" x2="260" y2="260" stroke="#9aa8bd" stroke-width="1.2"/>
      <line x1="0" y1="260" x2="260" y2="260" stroke="#9aa8bd" stroke-width="1.2"/>
      <g stroke="#1d8a5f" stroke-width="0.8" fill="#eefaf3">
        <rect x="2" y="2" width="30" height="30"/><rect x="34" y="2" width="30" height="30"/><rect x="66" y="2" width="30" height="30"/><rect x="98" y="2" width="30" height="30"/>
        <rect x="2" y="34" width="30" height="30"/><rect x="34" y="34" width="30" height="30"/><rect x="66" y="34" width="30" height="30"/><rect x="98" y="34" width="30" height="30"/>
        <rect x="2" y="66" width="30" height="30"/><rect x="34" y="66" width="30" height="30"/><rect x="66" y="66" width="30" height="30"/><rect x="98" y="66" width="30" height="30"/>
      </g>
      <text x="110" y="120" fill="#45536b">行号 = 右移量</text>
    </g>
    <text x="90" y="430" fill="#45536b">每行按行号循环右移（cyclic mapping）</text>
  </g>

  <!-- 右侧：FF / BP 读 -->
  <g>
    <rect x="530" y="90" width="390" height="150" rx="12" fill="#fff" stroke="#0e5a8a" stroke-width="2" filter="url(#sh)"/>
    <text x="550" y="118" fill="#0e5a8a" font-size="13.5" font-weight="700">FF 阶段：读“行”</text>
    <g transform="translate(550,132)">
      <g stroke="#0e5a8a" stroke-width="1.2" fill="#eef7fd">
        <rect x="2" y="2" width="40" height="22"/><rect x="44" y="2" width="40" height="22"/><rect x="88" y="2" width="40" height="22"/><rect x="132" y="2" width="40" height="22"/>
      </g>
      <line x1="0" y1="0" x2="180" y2="0" stroke="#0e5a8a" stroke-width="1"/>
    </g>
    <text x="550" y="186" fill="#45536b">读一整行 → 权重向量与激活对齐</text>
    <text x="550" y="208" fill="#45536b">→ A × W（普通矩阵乘）</text>
    <text x="550" y="232" fill="#0e5a8a" font-weight="600">读口：行方向</text>

    <rect x="530" y="260" width="390" height="160" rx="12" fill="#fff" stroke="#c25e2e" stroke-width="2" filter="url(#sh)"/>
    <text x="550" y="288" fill="#c25e2e" font-size="13.5" font-weight="700">BP 阶段：读“对角”＝转置</text>
    <g transform="translate(550,300)">
      <g stroke="#c25e2e" stroke-width="1.6" fill="#fdf3e7">
        <rect x="2" y="2" width="40" height="22"/>
        <rect x="44" y="24" width="40" height="22"/>
        <rect x="88" y="46" width="40" height="22"/>
        <rect x="132" y="68" width="40" height="22"/>
      </g>
      <line x1="0" y1="0" x2="180" y2="80" stroke="#c25e2e" stroke-width="1.4" stroke-dasharray="5,3"/>
    </g>
    <text x="550" y="410" fill="#45536b">读对角线（斜线）= 权重转置后的向量</text>
    <text x="550" y="432" fill="#c25e2e" font-weight="600">→ G × Wᵀ（转置乘）</text>
  </g>

  <rect x="60" y="440" width="860" height="0" rx="0"/>
</svg>
