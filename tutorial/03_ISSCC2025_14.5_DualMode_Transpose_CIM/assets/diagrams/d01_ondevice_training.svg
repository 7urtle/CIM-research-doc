<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="960" height="470" fill="#f6f8fb"/>
  <rect x="20" y="14" width="920" height="50" rx="10" fill="#0f1b2d"/>
  <text x="480" y="45" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">片上训练（On-Device Training）：前向 + 反向，两块硬骨头</text>

  <!-- FF -->
  <text x="250" y="94" text-anchor="middle" fill="#0e5a8a" font-size="15" font-weight="700">前向 FF（与推理相同）</text>
  <rect x="40" y="108" width="420" height="170" rx="12" fill="#fff" stroke="#0e5a8a" stroke-width="2" filter="url(#sh)"/>
  <g font-size="12">
    <rect x="70" y="132" width="100" height="50" rx="8" fill="#eef7fd" stroke="#0e5a8a"/>
    <text x="120" y="152" text-anchor="middle" fill="#0e5a8a">激活 A</text>
    <text x="120" y="170" text-anchor="middle" fill="#45536b">（M×N）</text>
    <rect x="250" y="132" width="100" height="50" rx="8" fill="#eefaf3" stroke="#1d8a5f"/>
    <text x="300" y="152" text-anchor="middle" fill="#1d8a5f">权重 W</text>
    <text x="300" y="170" text-anchor="middle" fill="#45536b">（N×K）</text>
    <rect x="430" y="132" width="0" height="0" rx="0"/>
    <text x="70" y="216" fill="#45536b">输出 = A × W（CIM 天然擅长）</text>
    <text x="70" y="248" fill="#45536b">→ 前向 = 普通矩阵乘</text>
  </g>

  <!-- BP -->
  <text x="710" y="94" text-anchor="middle" fill="#c25e2e" font-size="15" font-weight="700">反向 BP（训练独有）</text>
  <rect x="500" y="108" width="420" height="170" rx="12" fill="#fff" stroke="#c25e2e" stroke-width="2" filter="url(#sh)"/>
  <g font-size="12">
    <rect x="530" y="132" width="100" height="50" rx="8" fill="#fdf3e7" stroke="#e0a96a"/>
    <text x="580" y="152" text-anchor="middle" fill="#c25e2e">误差梯度 G</text>
    <text x="580" y="170" text-anchor="middle" fill="#45536b">（M×K）</text>
    <rect x="710" y="132" width="100" height="50" rx="8" fill="#eefaf3" stroke="#1d8a5f"/>
    <text x="760" y="152" text-anchor="middle" fill="#1d8a5f">Wᵀ 转置权重</text>
    <text x="760" y="170" text-anchor="middle" fill="#45536b">（K×N）</text>
    <text x="530" y="216" fill="#c25e2e" font-weight="600">输出 = G × Wᵀ（需要转置矩阵！）</text>
    <text x="530" y="248" fill="#45536b">→ CIM 里“权重转置”是硬骨头</text>
  </g>

  <rect x="40" y="302" width="880" height="144" rx="10" fill="#eef4fa" stroke="#c9d8ea"/>
  <text x="60" y="330" fill="#0e5a8a" font-size="13.5" font-weight="700">为什么“片上训练”值得做？</text>
  <text x="60" y="356" fill="#45536b" font-size="12.5">微调（fine-tuning）能显著提升模型精度；片上训练 vs 云端：实时响应、省电、隐私（数据不出设备）。</text>
  <text x="60" y="386" fill="#c25e2e" font-size="13" font-weight="700">三大难处（本文的问题定义）：</text>
  <text x="60" y="410" fill="#45536b" font-size="12.5">① 前作 FF/BP 用两套电路 → MAC 不复用，面积能效双输；② 只支持 INT → 训练精度低（INT 分辨率不足）；</text>
  <text x="60" y="432" fill="#45536b" font-size="12.5">③ 模拟 CIM 受 PVT 影响 → 训练精度进一步恶化。</text>
</svg>
