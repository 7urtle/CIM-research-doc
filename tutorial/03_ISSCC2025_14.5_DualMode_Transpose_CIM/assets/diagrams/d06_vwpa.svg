<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="960" height="420" fill="#f6f8fb"/>
  <rect x="20" y="14" width="920" height="46" rx="10" fill="#0f1b2d"/>
  <text x="480" y="43" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">VWPA 向量级预对齐：让“同向量元素”共享更小的截断窗口</text>

  <!-- 层级预对齐 -->
  <text x="250" y="94" text-anchor="middle" fill="#c25e2e" font-size="15" font-weight="700">传统：逐元素 / 逐层预对齐</text>
  <rect x="40" y="108" width="420" height="160" rx="12" fill="#fff" stroke="#e0a96a" stroke-width="2" filter="url(#sh)"/>
  <g font-size="12">
    <text x="60" y="140" fill="#45536b">每个元素的指数差单独对齐 →</text>
    <text x="60" y="164" fill="#45536b">指数跨度大 → 尾数被截掉很多位</text>
    <text x="60" y="196" fill="#45536b">（截断窗口 = 整个数据范围）</text>
    <text x="60" y="230" fill="#c25e2e" font-weight="600">→ 预对齐截断损失大</text>
  </g>

  <!-- VWPA -->
  <text x="710" y="94" text-anchor="middle" fill="#1d8a5f" font-size="15" font-weight="700">本文：VWPA 向量级预对齐</text>
  <rect x="500" y="108" width="420" height="160" rx="12" fill="#fff" stroke="#bfe6d2" stroke-width="2" filter="url(#sh)"/>
  <g font-size="12">
    <text x="520" y="140" fill="#45536b">对“同一个向量”的元素一起做预对齐：</text>
    <text x="520" y="164" fill="#45536b">同向量元素分布更接近 → 指数跨度小</text>
    <text x="520" y="196" fill="#45536b">→ 截断窗口更小 → 损失更小</text>
    <text x="520" y="230" fill="#1d8a5f" font-weight="600">→ 精度高于逐层预对齐 [1]</text>
  </g>

  <!-- 底部 -->
  <rect x="40" y="292" width="880" height="104" rx="10" fill="#eef4fa" stroke="#c9d8ea"/>
  <text x="60" y="320" fill="#0e5a8a" font-size="13.5" font-weight="700">为什么“同向量元素分布接近”？</text>
  <text x="60" y="346" fill="#45536b" font-size="12.5">神经网络里，同一输出通道对应的权重/激活往往数量级相近（权重初始化、批归一化都让分布集中）；</text>
  <text x="60" y="368" fill="#45536b" font-size="12.5">而不同层/不同通道之间差异很大。所以“按向量对齐”比“按整层对齐”的指数跨度小得多——</text>
  <text x="60" y="388" fill="#1d8a5f" font-size="12.5" font-weight="600">截断窗口 = 数据分布的“局部宽度”，VWPA 把这个宽度压到最小（精确模式下精度优于前作 [1]）。</text>
</svg>
