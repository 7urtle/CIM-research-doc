<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="960" height="430" fill="#f6f8fb"/>
  <rect x="20" y="14" width="920" height="46" rx="10" fill="#0f1b2d"/>
  <text x="480" y="43" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">四种数据格式：FP8（E5M2/E4M3）、BF16、INT4/INT8 —— 一个宏全支持</text>

  <!-- 格式条 -->
  <g font-size="10.5">
    <rect x="60" y="90" width="420" height="120" rx="10" fill="#fff" stroke="#0e5a8a" stroke-width="2" filter="url(#sh)"/>
    <text x="80" y="116" fill="#0e5a8a" font-size="13" font-weight="700">FP8（两种子格式）</text>
    <rect x="90" y="128" width="160" height="34" rx="6" fill="#eef7fd" stroke="#b8d9ee"/>
    <text x="170" y="150" text-anchor="middle" fill="#0e5a8a">E5M2：1+5+2</text>
    <text x="90" y="172" fill="#45536b">范围大、精度低（训练早期/损失缩放）</text>
    <rect x="280" y="128" width="180" height="34" rx="6" fill="#eef7fd" stroke="#b8d9ee"/>
    <text x="370" y="150" text-anchor="middle" fill="#0e5a8a">E4M3：1+4+3</text>
    <text x="280" y="172" fill="#45536b">范围小、精度高（前向/推理常用）</text>

    <rect x="500" y="90" width="420" height="120" rx="10" fill="#fff" stroke="#1d8a5f" stroke-width="2" filter="url(#sh)"/>
    <text x="520" y="116" fill="#1d8a5f" font-size="13" font-weight="700">BF16 / INT4 / INT8</text>
    <rect x="530" y="128" width="180" height="34" rx="6" fill="#eefaf3" stroke="#bfe6d2"/>
    <text x="620" y="150" text-anchor="middle" fill="#1d8a5f">BF16：1+8+7（与 FP32 同范围）</text>
    <rect x="530" y="168" width="180" height="34" rx="6" fill="#fdf3e7" stroke="#e0a96a"/>
    <text x="620" y="190" text-anchor="middle" fill="#c25e2e">INT4 / INT8 整数（最省）</text>
    <text x="740" y="150" fill="#45536b">统一走 SFME →</text>
    <text x="740" y="172" fill="#45536b">4b/8b 数据通路</text>
  </g>

  <!-- 权衡 -->
  <rect x="60" y="240" width="840" height="166" rx="10" fill="#eef4fa" stroke="#c9d8ea"/>
  <text x="80" y="268" fill="#0e5a8a" font-size="13.5" font-weight="700">格式选择的权衡（论文实测，Fig. 14.5.6）</text>
  <text x="80" y="296" fill="#45536b" font-size="12.5">ResNet-18@CIFAR10、VGG-19@CIFAR100 上：</text>
  <text x="80" y="320" fill="#45536b" font-size="12.5">• 精度：INT8 ≈ BF16 &gt; FP8 &gt; INT4（FP8 略低于 INT8/BF16，但显著高于 INT4）；</text>
  <text x="80" y="344" fill="#45536b" font-size="12.5">• 能效：FP8 显著优于 INT8 和 BF16；</text>
  <text x="80" y="368" fill="#45536b" font-size="12.5">→ FP8 是“能效 × 精度”平衡的最佳选择（这就是为什么峰值能效用 FP8 测）；</text>
  <text x="80" y="392" fill="#1d8a5f" font-size="12.5" font-weight="600">→ “一个宏四格式”让应用按精度/能效需求自由选型，训练推理通吃</text>
</svg>
