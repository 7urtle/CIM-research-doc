<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="960" height="490" fill="#f6f8fb"/>
  <rect x="20" y="14" width="920" height="46" rx="10" fill="#0f1b2d"/>
  <text x="480" y="43" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">DMBP-MAC：精确 / 近似双模位并行 MAC（BAM 乘法器 + LOA 加法树）</text>

  <!-- 结构 -->
  <rect x="40" y="80" width="440" height="260" rx="12" fill="#fff" stroke="#0e5a8a" stroke-width="2" filter="url(#sh)"/>
  <text x="60" y="108" fill="#0e5a8a" font-size="13.5" font-weight="700">DMBP-MAC 结构</text>
  <g font-size="11.5">
    <rect x="60" y="122" width="180" height="44" rx="7" fill="#eef7fd" stroke="#b8d9ee"/>
    <text x="150" y="140" text-anchor="middle" fill="#0e5a8a" font-weight="600">64 个 DM-MUL</text>
    <text x="150" y="158" text-anchor="middle" fill="#45536b">（双模式位并行乘法器）</text>
    <rect x="60" y="180" width="180" height="44" rx="7" fill="#f5f0fc" stroke="#dcccf0"/>
    <text x="150" y="198" text-anchor="middle" fill="#6b3fa0" font-weight="600">6 级 DM-ADD 加法树</text>
    <text x="150" y="216" text-anchor="middle" fill="#45536b">（双模式加法器）</text>
    <rect x="60" y="238" width="180" height="44" rx="7" fill="#eefaf3" stroke="#bfe6d2"/>
    <text x="150" y="256" text-anchor="middle" fill="#1d8a5f">→ 14b 点积输出</text>
    <text x="280" y="140" fill="#45536b">DM-MUL 基于 BAM</text>
    <text x="280" y="162" fill="#45536b">（broken-array 近似乘法器）</text>
    <text x="280" y="190" fill="#45536b">DM-ADD 用 LOA</text>
    <text x="280" y="212" fill="#45536b">（低位 OR 加法器）原理</text>
  </g>

  <!-- 双模式 -->
  <rect x="500" y="80" width="420" height="260" rx="12" fill="#fff" stroke="#1d8a5f" stroke-width="2" filter="url(#sh)"/>
  <text x="520" y="108" fill="#1d8a5f" font-size="13.5" font-weight="700">两种模式（按应用切换）</text>
  <g font-size="11.5">
    <rect x="520" y="122" width="180" height="80" rx="8" fill="#eef7fd" stroke="#b8d9ee"/>
    <text x="610" y="146" text-anchor="middle" fill="#0e5a8a" font-weight="600">精确模式（Accurate）</text>
    <text x="610" y="168" text-anchor="middle" fill="#45536b">全部部分积 + 完整加法树</text>
    <text x="610" y="188" text-anchor="middle" fill="#45536b">精度最高</text>
    <rect x="720" y="122" width="180" height="80" rx="8" fill="#fdf3e7" stroke="#e0a96a"/>
    <text x="810" y="146" text-anchor="middle" fill="#c25e2e" font-weight="600">近似模式（Approximate）</text>
    <text x="810" y="168" text-anchor="middle" fill="#45536b">丢 6 个右侧部分和 + 低位 OR</text>
    <text x="810" y="188" text-anchor="middle" fill="#45536b">速度 +12%、功耗 −31%</text>
    <text x="520" y="230" fill="#45536b">• 近似模式丢右侧 6 个部分和（BAM）；低位加法换成按位 OR（LOA）；</text>
    <text x="520" y="254" fill="#45536b">• 稀疏感知偏置加法器抵消 BAM 的偏移误差；</text>
    <text x="520" y="278" fill="#45536b">• 50k 随机采样：NMED（归一化平均误差距离）仅 5.3%，误差高斯分布、均值≈0</text>
    <text x="520" y="310" fill="#1d8a5f" font-weight="600">→ 关键路径缩短 + 翻转部件减少 → 更快更省</text>
  </g>

  <!-- 底部 -->
  <rect x="40" y="364" width="880" height="102" rx="10" fill="#eef4fa" stroke="#c9d8ea"/>
  <text x="60" y="392" fill="#0e5a8a" font-size="13.5" font-weight="700">中心对称布局（centrosymmetric layout）</text>
  <text x="60" y="418" fill="#45536b" font-size="12.5">把 DMBP-MAC 与 CWM-SRAM 以“中心对称”方式集成 → 优化宏的长宽比、缓解布线拥塞；</text>
  <text x="60" y="440" fill="#45536b" font-size="12.5">位并行（bit-parallel）对比位串行：周期更少（快）、输入翻转率低（省电）[2]。</text>
  <text x="60" y="460" fill="#1d8a5f" font-size="12.5" font-weight="600">→ 精确/近似双模 = 精度与能效按应用自由切换</text>
</svg>
