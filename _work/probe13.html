<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>probe</title></head>
<body>
<iframe id="f" src="http://127.0.0.1:8937/index.html" width="1200" height="4000"></iframe>
<pre id="out">waiting...</pre>
<script>
const out = document.getElementById('out');
function run() {
  try {
    const doc = document.getElementById('f').contentDocument;
    if (!doc) { out.textContent = 'no doc'; return; }
    const results = [];
    ['demoA', 'demoB', 'demoC'].forEach(id => {
      const c = doc.getElementById(id);
      if (!c) { results.push(id + ': NO CANVAS'); return; }
      const ctx = c.getContext('2d');
      const d = ctx.getImageData(0, 0, c.width, c.height).data;
      let nonbg = 0;
      for (let i = 0; i < d.length; i += 4) {
        if (d[i] < 240 || d[i+1] < 240 || d[i+2] < 245) nonbg++;
      }
      results.push(id + ': ' + c.width + 'x' + c.height + ' nonbg_px=' + nonbg);
    });
    const vs = doc.querySelectorAll('video source');
    results.push('video sources: ' + vs.length);
    const imgs = doc.querySelectorAll('img');
    let missing = 0;
    imgs.forEach(im => { if (im.complete && im.naturalWidth === 0) missing++; });
    results.push('missing imgs: ' + missing);
    out.textContent = results.join('\n');
  } catch (e) { out.textContent = 'ERR: ' + e.message; }
}
setTimeout(run, 3000);
</script>
</body></html>
